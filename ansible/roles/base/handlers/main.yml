---
# Re-asserting the host's existing static IP is a no-op, so this won't drop the
# connection on a re-run. It only reconfigures when the rendered file changes.
- name: Apply netplan
  become: true
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true
  when: lab_netplan_apply | bool

# Clears the failed boot. No netplan apply: the addresses haven't changed.
- name: Check the network again
  become: true
  ansible.builtin.systemd_service:
    name: systemd-networkd-wait-online
    state: restarted
    daemon_reload: true
  when: lab_netplan_apply | bool
