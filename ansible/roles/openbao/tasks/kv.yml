---
# KV v2 engine for application credentials (e.g. the UpSnap superuser). App roles
# generate their own secret and store it here via the provisioner AppRole, so app
# passwords live in the secrets manager and a rebuild re-creates them with no human
# input — never hand-set in SOPS. Idempotent.
- name: Enable the KV v2 secrets engine
  environment:
    BAO_ADDR: "{{ openbao_api_addr }}"
    BAO_TOKEN: "{{ openbao_mgmt_token }}"
    BAO_SKIP_VERIFY: "true"
  block:
    - name: Enable the KV v2 secrets engine
      ansible.builtin.command:
        cmd: "bao secrets enable -path={{ openbao_kv_mount }} kv-v2"
      register: openbao_kv_enable
      changed_when: openbao_kv_enable.rc == 0
      failed_when:
        - openbao_kv_enable.rc != 0
        - "'path is already in use' not in openbao_kv_enable.stderr"
