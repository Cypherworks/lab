---
# One entry of technitium_dns_forwarder_zones, as _forwarder_zone.
- name: Find the zone on the server
  ansible.builtin.set_fact:
    _existing_zone: "{{ _zones.json.response.zones | selectattr('name', 'eq', _forwarder_zone.zone) | first | default({}) }}"
    _zone_validation: "{{ _forwarder_zone.dnssec_validation | default(_forwarder_zone.forwarder == 'this-server') | bool }}"
    _zone_catalog: "{{ 'cluster-catalog.' ~ technitium_dns_cluster_domain if technitium_dns_cluster_domain else '' }}"

# A primary of the same name would hide every public record from clients.
- name: Refuse a same-named zone of another type
  ansible.builtin.assert:
    that: _existing_zone.type | default('Forwarder') == 'Forwarder'
    fail_msg: "{{ _forwarder_zone.zone }} exists as {{ _existing_zone.type | default('') }}, not a Forwarder zone; delete it in the console first."

- name: Create the zone
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/create"
    method: POST
    body_format: form-urlencoded
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
    body:
      zone: "{{ _forwarder_zone.zone }}"
      type: Forwarder
      forwarder: "{{ _forwarder_zone.forwarder }}"
      protocol: "{{ technitium_dns_forwarder_protocol }}"
      dnssecValidation: "{{ _zone_validation | string | lower }}"
  register: _created
  when: _existing_zone | length == 0
  failed_when: _created.json.status | default('') != 'ok'
  changed_when: true
  no_log: true

- name: Hold its query access and cluster membership
  ansible.builtin.include_tasks: zone_options.yml
  vars:
    _held_zone: "{{ _forwarder_zone.zone }}"
    _held_zone_acl: "{{ _forwarder_zone.query_acl | default([]) }}"

- name: Hold its local records
  ansible.builtin.include_tasks: zone_records.yml
  vars:
    _held_zone: "{{ _forwarder_zone.zone }}"
    _held_zone_records: "{{ _forwarder_zone.records | default({}) }}"

# The apex's too. A passthrough name without a FWD record hits a wildcard.
- name: Hold its forwarding to the role's
  vars:
    _fqdn: "{{ item }}"
    _named: "{{ _zone_records.json.response.records | selectattr('name', 'eq', _fqdn) }}"
    _held: "{{ _named | selectattr('type', 'eq', 'FWD') | map(attribute='rData') | list }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/records/add"
    method: POST
    body_format: form-urlencoded
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
    body:
      zone: "{{ _forwarder_zone.zone }}"
      domain: "{{ _fqdn }}"
      type: FWD
      forwarder: "{{ _forwarder_zone.forwarder }}"
      protocol: "{{ technitium_dns_forwarder_protocol }}"
      dnssecValidation: "{{ _zone_validation | string | lower }}"
      overwrite: "true"
  loop: "{{ [_forwarder_zone.zone] + (_forwarder_zone.passthrough | default([]) | map('regex_replace', '$', '.' ~ _forwarder_zone.zone) | list) }}"
  loop_control:
    label: "{{ item }}"
  register: _forwarding_added
  when: >-
    _held | length != 1
    or _held[0].forwarder != _forwarder_zone.forwarder
    or (_held[0].dnssecValidation | bool) != (_zone_validation | bool)
  failed_when: _forwarding_added.json.status | default('') != 'ok'
  changed_when: true
  no_log: true
