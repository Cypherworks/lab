---
# One entry of technitium_dns_forwarder_zones, as _forwarder_zone.
- name: Find the zone on the server
  ansible.builtin.set_fact:
    _existing_zone: "{{ _zones.json.response.zones | selectattr('name', 'eq', _forwarder_zone.zone) | first | default({}) }}"
    _zone_validation: "{{ _forwarder_zone.dnssec_validation | default(_forwarder_zone.forwarder == 'this-server') | bool }}"
    _zone_catalog: "{{ 'cluster-catalog.' ~ technitium_dns_cluster_domain if technitium_dns_cluster_domain else '' }}"

# A primary of the same name would hide every public record from clients.
- name: Refuse a same-named zone of another type
  ansible.builtin.assert:
    that: _existing_zone.type | default('Forwarder') == 'Forwarder'
    fail_msg: "{{ _forwarder_zone.zone }} exists as {{ _existing_zone.type | default('') }}, not a Forwarder zone; delete it in the console first."

- name: Create the zone
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/create"
    method: POST
    body_format: form-urlencoded
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
    body:
      zone: "{{ _forwarder_zone.zone }}"
      type: Forwarder
      forwarder: "{{ _forwarder_zone.forwarder }}"
      protocol: "{{ technitium_dns_forwarder_protocol }}"
      dnssecValidation: "{{ _zone_validation | string | lower }}"
  register: _created
  when: _existing_zone | length == 0
  failed_when: _created.json.status | default('') != 'ok'
  changed_when: true
  no_log: true

- name: Read the zone's query access
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/options/get?zone={{ _forwarder_zone.zone | urlencode }}"
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
  register: _zone_options
  failed_when: _zone_options.json.status | default('') != 'ok'
  no_log: true

# A member zone keeps its own query access only with the override set.
- name: Hold its query access and cluster membership to the role's
  vars:
    _o: "{{ _zone_options.json.response }}"
    _acl: "{{ _forwarder_zone.query_acl | default([]) }}"
    _access: "{{ 'UseSpecifiedNetworkACL' if _acl else 'Allow' }}"
    _drift: >-
      {{ _o.queryAccess != _access
         or (_acl and (_o.queryAccessNetworkACL | default([], true) | sort) != (_acl | sort))
         or (_zone_catalog and (_o.catalog != _zone_catalog or not (_o.overrideCatalogQueryAccess | bool))) }}
    _acl_body: "{{ {'queryAccessNetworkACL': _acl | join(',')} if _acl else {} }}"
    _catalog_body: "{{ {'catalog': _zone_catalog, 'overrideCatalogQueryAccess': 'true'} if _zone_catalog else {} }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/options/set"
    method: POST
    body_format: form-urlencoded
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
    body: "{{ {'zone': _forwarder_zone.zone, 'queryAccess': _access} | combine(_acl_body, _catalog_body) }}"
  register: _options_set
  when: _drift | bool
  failed_when: _options_set.json.status | default('') != 'ok'
  changed_when: true
  no_log: true

- name: Read the zone's records
  vars:
    _zone: "{{ _forwarder_zone.zone | urlencode }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/records/get?zone={{ _zone }}&domain={{ _zone }}&listZone=true"
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
  register: _zone_records
  failed_when: _zone_records.json.status | default('') != 'ok'
  no_log: true

- name: Hold its local records to the role's
  vars:
    _fqdn: "{{ item.key }}.{{ _forwarder_zone.zone }}"
    _named: "{{ _zone_records.json.response.records | selectattr('name', 'eq', _fqdn) }}"
    _held: "{{ _named | selectattr('type', 'eq', 'A') | map(attribute='rData.ipAddress') | list }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/records/add"
    method: POST
    body_format: form-urlencoded
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
    body:
      zone: "{{ _forwarder_zone.zone }}"
      domain: "{{ _fqdn }}"
      type: A
      ipAddress: "{{ item.value }}"
      overwrite: "true"
  loop: "{{ _forwarder_zone.records | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _record_added
  when: _held != [item.value]
  failed_when: _record_added.json.status | default('') != 'ok'
  changed_when: true
  no_log: true

# The apex's too. A passthrough name without a FWD record hits a wildcard.
- name: Hold its forwarding to the role's
  vars:
    _fqdn: "{{ item }}"
    _named: "{{ _zone_records.json.response.records | selectattr('name', 'eq', _fqdn) }}"
    _held: "{{ _named | selectattr('type', 'eq', 'FWD') | map(attribute='rData') | list }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/records/add"
    method: POST
    body_format: form-urlencoded
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
    body:
      zone: "{{ _forwarder_zone.zone }}"
      domain: "{{ _fqdn }}"
      type: FWD
      forwarder: "{{ _forwarder_zone.forwarder }}"
      protocol: "{{ technitium_dns_forwarder_protocol }}"
      dnssecValidation: "{{ _zone_validation | string | lower }}"
      overwrite: "true"
  loop: "{{ [_forwarder_zone.zone] + (_forwarder_zone.passthrough | default([]) | map('regex_replace', '$', '.' ~ _forwarder_zone.zone) | list) }}"
  loop_control:
    label: "{{ item }}"
  register: _forwarding_added
  when: >-
    _held | length != 1
    or _held[0].forwarder != _forwarder_zone.forwarder
    or (_held[0].dnssecValidation | bool) != (_zone_validation | bool)
  failed_when: _forwarding_added.json.status | default('') != 'ok'
  changed_when: true
  no_log: true
