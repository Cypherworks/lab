---
# Start the service, then hold its settings to the role's through the API on
# loopback (never over the network). Run the firewall role first.
- name: Start Technitium DNS
  ansible.builtin.include_tasks: start.yml

- name: Wait for the API on loopback
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ technitium_dns_http_port }}"
    timeout: 120

- name: Check port 53
  ansible.builtin.include_tasks: check_port_53.yml

- name: Hold what the role holds through the API
  ansible.builtin.include_tasks: hold.yml

- name: Hold the metrics collector
  ansible.builtin.include_tasks: metrics.yml
