---
# Hold one zone's query access and cluster membership: _held_zone, with its
# client list as _held_zone_acl and _zone_catalog set by the caller.
- name: Read the zone's query access
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/options/get?zone={{ _held_zone | urlencode }}"
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
  register: _zone_options
  failed_when: _zone_options.json.status | default('') != 'ok'
  no_log: true

# A member zone keeps its own query access only with the override set.
- name: Hold its query access and cluster membership to the role's
  vars:
    _o: "{{ _zone_options.json.response }}"
    _acl: "{{ _held_zone_acl }}"
    _access: "{{ 'UseSpecifiedNetworkACL' if _acl else 'Allow' }}"
    _drift: >-
      {{ _o.queryAccess != _access
         or (_acl and (_o.queryAccessNetworkACL | default([], true) | sort) != (_acl | sort))
         or (_zone_catalog and (_o.catalog != _zone_catalog or not (_o.overrideCatalogQueryAccess | bool))) }}
    _acl_body: "{{ {'queryAccessNetworkACL': _acl | join(',')} if _acl else {} }}"
    _catalog_body: "{{ {'catalog': _zone_catalog, 'overrideCatalogQueryAccess': 'true'} if _zone_catalog else {} }}"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ technitium_dns_http_port }}/api/zones/options/set"
    method: POST
    body_format: form-urlencoded
    headers: { Authorization: "Bearer {{ _login.json.token }}" }
    body: "{{ {'zone': _held_zone, 'queryAccess': _access} | combine(_acl_body, _catalog_body) }}"
  register: _options_set
  when: _drift | bool
  failed_when: _options_set.json.status | default('') != 'ok'
  changed_when: true
  no_log: true
