---
# Exercises the host zones against a throwaway container: a forward zone plus
# the /24 reverse zones derived from one host map. Needs Docker and dig; no
# internet. From ansible/:
#
#   ANSIBLE_ROLES_PATH=roles ansible-playbook -i localhost, \
#     roles/technitium_dns/tests/host_zones.yml
- name: Verify the host zones
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # technitium/dns-server:15.6.2, the role's pinned version.
    _image: technitium/dns-server@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    _container: technitium-host-zones-test
    _dns_port: 15423
    _api: "http://127.0.0.1:{{ technitium_dns_http_port }}/api"
    _auth: { Authorization: "Bearer {{ _login.json.token }}" }
    _dig: dig +short +time=3 +tries=2 -p {{ _dns_port }} @127.0.0.1
    technitium_dns_http_port: 15424
    technitium_dns_host_domain: lab.labcheck
    technitium_dns_hosts:
      alpha: 10.99.1.11
      beta: 10.99.1.12
      gamma: 10.99.2.21
  tasks:
    - name: Draw this run's admin password
      ansible.builtin.set_fact:
        technitium_dns_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Hold, change, hold again, and clean up
      block:
        - name: Start a throwaway Technitium on loopback
          ansible.builtin.command: >-
            docker run -d --name {{ _container }}
            -p 127.0.0.1:{{ technitium_dns_http_port }}:5380
            -p 127.0.0.1:{{ _dns_port }}:53/udp {{ _image }}
          changed_when: true

        - name: Wait for its API to answer, as Docker's proxy accepts before it
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ technitium_dns_http_port }}/"
          register: _up
          until: _up.status == 200
          retries: 60
          delay: 2

        - name: Hold the host zones
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: host_zones

        - name: Check the answers
          ansible.builtin.include_tasks: host_zones_answers.yml

        - name: Read each zone's serial
          ansible.builtin.uri:
            url: "{{ _api }}/zones/list"
            headers: "{{ _auth }}"
          register: _before

        - name: Hold them again with nothing to change
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: host_zones

        - name: Read each zone's serial again
          ansible.builtin.uri:
            url: "{{ _api }}/zones/list"
            headers: "{{ _auth }}"
          register: _after

        - name: Assert a rerun wrote nothing, as any write bumps a serial
          vars:
            _serials: "{{ _before.json.response.zones | map(attribute='soaSerial') | list }}"
          ansible.builtin.assert:
            that: _after.json.response.zones | map(attribute='soaSerial') | list == _serials
            fail_msg: "{{ _serials }} became {{ _after.json.response.zones | map(attribute='soaSerial') | list }}"

        - name: Change the zones the way someone might in the console
          ansible.builtin.uri:
            url: "{{ _api }}/{{ item }}"
            headers: "{{ _auth }}"
          register: _console
          failed_when: _console.json.status != 'ok'
          loop:
            - zones/records/add?zone=lab.labcheck&domain=alpha.lab.labcheck&type=A&ipAddress=10.99.9.99&overwrite=true
            - zones/records/delete?zone=1.99.10.in-addr.arpa&domain=12.1.99.10.in-addr.arpa&type=PTR&ptrName=beta.lab.labcheck
            - zones/records/add?zone=lab.labcheck&domain=adhoc.lab.labcheck&type=A&ipAddress=10.99.9.1

        - name: Hold them after the change
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: host_zones

        - name: Check the answers are back
          ansible.builtin.include_tasks: host_zones_answers.yml

        - name: Ask for the console's own record
          ansible.builtin.command: "{{ _dig }} adhoc.lab.labcheck A"
          register: _adhoc
          changed_when: false

        - name: Assert the console's own record was left alone
          ansible.builtin.assert:
            that: _adhoc.stdout == '10.99.9.1'
            fail_msg: "adhoc answered '{{ _adhoc.stdout }}'"

        - name: Make a forwarder zone under a host zone's name
          ansible.builtin.uri:
            url: "{{ _api }}/zones/create?zone=wrong.labcheck&type=Forwarder&forwarder=this-server&protocol=Udp"
            headers: "{{ _auth }}"
          register: _wrong
          failed_when: _wrong.json.status != 'ok'

        - name: Hold a zone that exists as another type
          vars:
            technitium_dns_host_domain: wrong.labcheck
          block:
            - name: Hold the host zones
              ansible.builtin.include_role:
                name: technitium_dns
                tasks_from: host_zones

            - name: Record that the hold went through
              ansible.builtin.set_fact:
                _wrong_type: ""
          rescue:
            - name: Record which task failed
              ansible.builtin.set_fact:
                _wrong_type: "{{ ansible_failed_task.name }}"

        - name: Assert a zone of another type is refused
          ansible.builtin.assert:
            that: _wrong_type == 'Refuse a same-named zone of another type'
            fail_msg: "expected the type check to fail, got '{{ _wrong_type }}'"
            success_msg: a zone of another type is refused as expected
      rescue:
        - name: Fail the test with the failed task's message
          ansible.builtin.fail:
            msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"
      always:
        - name: Remove the container
          ansible.builtin.command: docker rm -f {{ _container }}
          changed_when: true
          failed_when: false
