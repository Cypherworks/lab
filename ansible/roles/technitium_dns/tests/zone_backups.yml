---
# Exercises zone backups and the empty-server restore against a throwaway
# Technitium container on this machine's loopback, with a scratch archive
# dir. Needs Docker and dig; touches no real server. From ansible/:
#
#   ANSIBLE_ROLES_PATH=roles ansible-playbook -i localhost, \
#     roles/technitium_dns/tests/zone_backups.yml
- name: Verify zone backups and restores
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _container: technitium-zone-backups-test
    # technitium/dns-server:15.6.2, the role's pinned version.
    _image: technitium/dns-server@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    _dns_port: 15353
    _zone: airgap.test
    _api: "http://127.0.0.1:{{ technitium_dns_http_port }}/api"
    _dig: "dig +short +time=2 +tries=1 -p {{ _dns_port }} @127.0.0.1"
    technitium_dns_http_port: 15380
    technitium_dns_backup_keep: 2
  tasks:
    # A lookup in vars would draw a new password each time it's read.
    - name: Draw this run's admin password
      ansible.builtin.set_fact:
        technitium_dns_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Make a scratch archive dir
      ansible.builtin.tempfile:
        state: directory
        suffix: .technitium
      register: _scratch

    - name: Back up, restore, and clean up
      vars:
        technitium_dns_archive_dir: "{{ _scratch.path }}"
        _backups: "{{ _scratch.path }}/localhost-zones-"
      block:
        - name: Start a throwaway Technitium on loopback
          ansible.builtin.command: >-
            docker run -d --rm --name {{ _container }}
            -p 127.0.0.1:{{ technitium_dns_http_port }}:5380
            -p 127.0.0.1:{{ _dns_port }}:53/udp
            {{ _image }}
          changed_when: true

        - name: Wait for its API to answer, as Docker's proxy accepts before it
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ technitium_dns_http_port }}/"
          register: _up
          until: _up.status == 200
          retries: 60
          delay: 2

        - name: Restore into an empty server with no backup to restore
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: restore_zones

        - name: Make a zone with a record
          ansible.builtin.uri:
            url: "{{ _api }}/{{ item }}"
            headers: { Authorization: "Bearer {{ _login.json.token }}" }
          register: _made
          failed_when: _made.json.status != 'ok'
          loop:
            - zones/create?zone={{ _zone }}&type=Primary
            - zones/records/add?zone={{ _zone }}&domain=www.{{ _zone }}&type=A&ipAddress=192.0.2.10

        - name: Leave two older backups for the rotation to prune one of
          ansible.builtin.copy:
            content: old
            dest: "{{ _backups }}{{ item }}.zip"
            mode: "0600"
          loop: [20200101T000000Z, 20200102T000000Z]

        # Technitium writes zone changes to disk 5 s later (its save timer).
        - name: Wait for the zone to reach disk
          ansible.builtin.pause:
            seconds: 10

        - name: Back up the zones
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: backup_zones

        - name: List the backups
          ansible.builtin.find:
            paths: "{{ _scratch.path }}"
            patterns: localhost-zones-*.zip
          register: _kept

        - name: Assert the rotation kept the newest two, private
          vars:
            _names: "{{ _kept.files | map(attribute='path') | map('basename') | sort }}"
          ansible.builtin.assert:
            that:
              - _names | length == 2
              - _names[0] == 'localhost-zones-20200102T000000Z.zip'
              - _names[1] is match('localhost-zones-\d{8}T\d{6}Z\.zip$')
              - _kept.files | map(attribute='mode') | unique == ['0600']
            fail_msg: "kept {{ _names }} with modes {{ _kept.files | map(attribute='mode') | list }}"

        - name: Add a record after the backup
          ansible.builtin.uri:
            url: "{{ _api }}/zones/records/add?zone={{ _zone }}&domain=late.{{ _zone }}&type=A&ipAddress=192.0.2.11"
            headers: { Authorization: "Bearer {{ _login.json.token }}" }
          register: _late
          failed_when: _late.json.status != 'ok'

        - name: Restore into a server that has zones
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: restore_zones

        - name: Ask for the record added after the backup
          ansible.builtin.command: "{{ _dig }} late.{{ _zone }} A"
          register: _late_answer
          changed_when: false

        - name: Assert a server with zones was left alone
          ansible.builtin.assert:
            that: _late_answer.stdout == '192.0.2.11'
            fail_msg: "late.{{ _zone }} answered '{{ _late_answer.stdout }}'; the restore overwrote a live zone"

        - name: Lose the zone
          ansible.builtin.uri:
            url: "{{ _api }}/zones/delete?zone={{ _zone }}"
            headers: { Authorization: "Bearer {{ _login.json.token }}" }
          register: _deleted
          failed_when: _deleted.json.status != 'ok'

        - name: Restore into the now empty server
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: restore_zones

        - name: Ask for both records
          ansible.builtin.command: "{{ _dig }} {{ item }}.{{ _zone }} A"
          register: _answers
          changed_when: false
          loop: [www, late]

        - name: Assert the backup's records came back, and only those
          ansible.builtin.assert:
            that:
              - _answers.results[0].stdout == '192.0.2.10'
              - _answers.results[1].stdout == ''
            fail_msg: "www answered '{{ _answers.results[0].stdout }}', late answered '{{ _answers.results[1].stdout }}'"

        - name: Restore a backup Technitium rejects
          block:
            - name: Make the newest backup unreadable
              ansible.builtin.copy:
                content: not a zip
                dest: "{{ _backups }}29991231T000000Z.zip"
                mode: "0600"

            - name: Lose the zone again
              ansible.builtin.uri:
                url: "{{ _api }}/zones/delete?zone={{ _zone }}"
                headers: { Authorization: "Bearer {{ _login.json.token }}" }
              register: _deleted
              failed_when: _deleted.json.status != 'ok'

            - name: Restore the unreadable backup
              ansible.builtin.include_role:
                name: technitium_dns
                tasks_from: restore_zones

            - name: Record that the restore went through
              ansible.builtin.set_fact:
                _bad_restore: ""
          rescue:
            - name: Record which task failed
              ansible.builtin.set_fact:
                _bad_restore: "{{ ansible_failed_task.name }}"

        - name: Assert an unreadable backup fails the restore
          ansible.builtin.assert:
            that: _bad_restore == 'Restore the zones from the backup'
            fail_msg: "expected the restore call to fail, got '{{ _bad_restore }}'"
            success_msg: unreadable backup fails as expected
      rescue:
        - name: Fail the test with the failed task's message
          ansible.builtin.fail:
            msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"
      always:
        - name: Remove the container
          ansible.builtin.command: docker rm -f {{ _container }}
          changed_when: true
          failed_when: false

        - name: Remove the scratch archive dir
          ansible.builtin.file:
            path: "{{ _scratch.path }}"
            state: absent
