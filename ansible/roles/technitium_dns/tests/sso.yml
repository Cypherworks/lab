---
# Exercises the SSO settings against a throwaway container. The provider is
# never reached, as Technitium only contacts it at login, so this covers what
# the role holds, not a real sign-in. Needs Docker. From ansible/:
#
#   ANSIBLE_ROLES_PATH=roles ansible-playbook -i localhost, \
#     roles/technitium_dns/tests/sso.yml
- name: Verify the SSO settings
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # technitium/dns-server:15.6.2, the role's pinned version.
    _image: technitium/dns-server@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245
    _container: technitium-sso-test
    _api: "http://127.0.0.1:{{ technitium_dns_http_port }}/api"
    _auth: { Authorization: "Bearer {{ _login.json.token }}" }
    _authority: https://auth.example.invalid/application/o/technitium/
    technitium_dns_http_port: 15389
    technitium_dns_sso_authority: "{{ _authority }}"
    technitium_dns_sso_client_id: test-client
    technitium_dns_sso_client_secret: test-secret-value
    technitium_dns_sso_group_map:
      dns-admins: Administrators
  tasks:
    - name: Draw this run's admin password
      ansible.builtin.set_fact:
        technitium_dns_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Hold, change, hold again, and clean up
      block:
        - name: Start a throwaway Technitium on loopback
          ansible.builtin.command: >-
            docker run -d --name {{ _container }}
            -p 127.0.0.1:{{ technitium_dns_http_port }}:5380 {{ _image }}
          changed_when: true

        - name: Wait for its API to answer, as Docker's proxy accepts before it
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ technitium_dns_http_port }}/"
          register: _up
          until: _up.status == 200
          retries: 60
          delay: 2

        - name: Hold the SSO settings
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: sso

        - name: Watch the API for the web service restart
          ansible.builtin.command: "{{ ansible_playbook_python }} -I {{ playbook_dir }}/api_steady.py {{ technitium_dns_http_port }} 4"
          changed_when: false

        - name: Read the SSO settings
          ansible.builtin.uri:
            url: "{{ _api }}/admin/sso/get"
            headers: "{{ _auth }}"
          register: _held

        - name: Assert they're the role's, with sign-up for mapped users only
          vars:
            _s: "{{ _held.json.response }}"
          ansible.builtin.assert:
            that:
              - _s.ssoEnabled | bool
              - _s.ssoAuthority == _authority
              - _s.ssoClientId == 'test-client'
              - _s.ssoClientSecret != 'test-secret-value'
              - _s.ssoAllowSignup | bool
              - _s.ssoAllowSignupOnlyForMappedUsers | bool
              - "_s.ssoGroupMap == [{'remoteGroup': 'dns-admins', 'localGroup': 'Administrators'}]"
            fail_msg: "{{ _s | to_json }}"

        - name: Log in with the local admin password, the fallback
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: login

        - name: Hold them again with nothing to change
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: sso

        - name: Assert the masked secret doesn't read as a change
          ansible.builtin.assert:
            that: _sso_set is skipped
            fail_msg: the role wrote the SSO settings with nothing to change

        - name: Change them the way someone might in the console
          ansible.builtin.uri:
            url: "{{ _api }}/admin/sso/set?ssoClientId=other&ssoGroupMap=someone%7CAdministrators"
            headers: "{{ _auth }}"
          register: _console
          failed_when: _console.json.status != 'ok'

        - name: Hold them after the change
          ansible.builtin.include_role:
            name: technitium_dns
            tasks_from: sso

        - name: Read them back
          ansible.builtin.uri:
            url: "{{ _api }}/admin/sso/get"
            headers: "{{ _auth }}"
          register: _restored

        - name: Assert the change was put back
          vars:
            _s: "{{ _restored.json.response }}"
          ansible.builtin.assert:
            that:
              - _s.ssoClientId == 'test-client'
              - "_s.ssoGroupMap == [{'remoteGroup': 'dns-admins', 'localGroup': 'Administrators'}]"
            fail_msg: "{{ _s | to_json }}"

        - name: Hold SSO settings that are incomplete
          block:
            - name: Hold the SSO settings
              ansible.builtin.include_role:
                name: technitium_dns
                tasks_from: sso
              vars:
                technitium_dns_sso_client_secret: ""

            - name: Record that the hold went through
              ansible.builtin.set_fact:
                _incomplete: ""
          rescue:
            - name: Record which task failed
              ansible.builtin.set_fact:
                _incomplete: "{{ ansible_failed_task.name }}"

        - name: Assert incomplete settings are refused
          ansible.builtin.assert:
            that: _incomplete == 'Check the SSO settings'
            fail_msg: "expected the settings check to fail, got '{{ _incomplete }}'"
            success_msg: incomplete SSO settings are refused as expected
      rescue:
        - name: Fail the test with the failed task's message
          ansible.builtin.fail:
            msg: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"
      always:
        - name: Remove the container
          ansible.builtin.command: docker rm -f {{ _container }}
          changed_when: true
          failed_when: false
