---
# Docker Engine + the Compose v2 plugin. Override to add packages if a consumer needs
# more (e.g. docker-buildx-plugin).
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

# OnCalendar for a scheduled `docker system prune --all` (README). Empty: off.
docker_prune_on_calendar: ""
# Prune only what was created longer ago than this (a Go duration).
docker_prune_until: 168h
