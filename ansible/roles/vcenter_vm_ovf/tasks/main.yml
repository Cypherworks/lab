---
# Deploy the VM once (skipped when one with this name exists), size it, power
# it on, and publish its first IPv4 address as vcenter_vm_ovf_ip.
- name: Check the required settings
  ansible.builtin.assert:
    that:
      - vcenter_vm_ovf_hostname | length > 0
      - vcenter_vm_ovf_name | length > 0
      - vcenter_vm_ovf_datacenter | length > 0
      - vcenter_vm_ovf_esxi_hostname | length > 0
      - vcenter_vm_ovf_datastore | length > 0
      - vcenter_vm_ovf_network | length > 0
      - vcenter_vm_ovf_ova_url | length > 0
      - vcenter_vm_ovf_ova_sha256 | length == 64
      - vcenter_vm_ovf_ssh_authorized_keys | length > 0
    fail_msg: vcenter_vm_ovf needs vCenter, placement, network, a pinned OVA and a key.

- name: Deploy, size and start the VM
  delegate_to: localhost
  module_defaults:
    group/community.vmware.vmware:
      hostname: "{{ vcenter_vm_ovf_hostname }}"
      username: "{{ vcenter_vm_ovf_username }}"
      password: "{{ vcenter_vm_ovf_password }}"
      validate_certs: "{{ vcenter_vm_ovf_validate_certs }}"
      datacenter: "{{ vcenter_vm_ovf_datacenter }}"
  block:
    - name: Look for an existing VM of this name
      community.vmware.vmware_guest_info:
        name: "{{ vcenter_vm_ovf_name }}"
      register: _vm_existing
      failed_when: false

    - name: Fetch and verify the OVA
      when: _vm_existing.instance is not defined
      block:
        - name: Create the OVA cache directory
          ansible.builtin.file:
            path: "{{ vcenter_vm_ovf_cache_dir }}"
            state: directory
            mode: "0700"

        - name: Download the pinned OVA
          ansible.builtin.get_url:
            url: "{{ vcenter_vm_ovf_ova_url }}"
            dest: "{{ vcenter_vm_ovf_cache_dir }}/{{ vcenter_vm_ovf_ova_url | basename }}"
            checksum: "sha256:{{ vcenter_vm_ovf_ova_sha256 }}"
            mode: "0600"

        - name: Build the cloud-init vApp properties
          ansible.builtin.set_fact:
            _vm_ovf_properties:
              instance-id: "{{ vcenter_vm_ovf_name }}"
              hostname: "{{ vcenter_vm_ovf_guest_hostname }}"
              public-keys: "{{ vcenter_vm_ovf_ssh_authorized_keys | join('\n') }}"
              user-data: "{{ lookup('ansible.builtin.template', 'user-data.yml.j2') | b64encode }}"

        # Warnings still print (Ubuntu's OVA has extraConfig vCenter rejects).
        - name: Deploy the OVA, powered off, seeded by cloud-init
          community.vmware.vmware_deploy_ovf:
            name: "{{ vcenter_vm_ovf_name }}"
            esxi_hostname: "{{ vcenter_vm_ovf_esxi_hostname }}"
            datastore: "{{ vcenter_vm_ovf_datastore }}"
            folder: "{{ vcenter_vm_ovf_folder | default(omit, true) }}"
            ovf: "{{ vcenter_vm_ovf_cache_dir }}/{{ vcenter_vm_ovf_ova_url | basename }}"
            networks: "{{ {vcenter_vm_ovf_ovf_network: vcenter_vm_ovf_network} }}"
            disk_provisioning: thin
            inject_ovf_env: true
            fail_on_spec_warnings: false
            power_on: false
            properties: "{{ _vm_ovf_properties }}"

        - name: Read the deployed VM's vApp properties
          community.vmware.vmware_guest_info:
            name: "{{ vcenter_vm_ovf_name }}"
            schema: vsphere
            properties: ["config.vAppConfig.property"]
          register: _vm_vapp

        - name: Fail unless every cloud-init property took its value
          vars:
            _set: "{{ _vm_vapp.instance.config.vAppConfig.property | default([])
                      | items2dict(key_name='id', value_name='value') }}"
          ansible.builtin.assert:
            that: _set[item.key] | default(none) == item.value
            fail_msg: "The OVA has no '{{ item.key }}' vApp property, or it didn't take; cloud-init won't seed the VM."
            quiet: true
          loop: "{{ _vm_ovf_properties | dict2items }}"
          loop_control:
            label: "{{ item.key }}"

        - name: Set the CPU and memory
          community.vmware.vmware_guest:
            name: "{{ vcenter_vm_ovf_name }}"
            state: present
            hardware:
              num_cpus: "{{ vcenter_vm_ovf_num_cpus }}"
              memory_mb: "{{ vcenter_vm_ovf_memory_mb }}"

        - name: Read the root disk's controller
          community.vmware.vmware_guest_disk_info:
            name: "{{ vcenter_vm_ovf_name }}"
          register: _vm_disks

        - name: Grow the root disk (cloud-init grows the filesystem)
          vars:
            _root: "{{ _vm_disks.guest_disk_info['0'] }}"
          community.vmware.vmware_guest_disk:
            name: "{{ vcenter_vm_ovf_name }}"
            disk:
              - size_gb: "{{ vcenter_vm_ovf_disk_gb }}"
                controller_type: "{{ _root.controller_type }}"
                controller_number: "{{ _root.controller_bus_number }}"
                unit_number: "{{ _root.unit_number }}"
                state: present
          when: (_root.capacity_in_kb | int) < (vcenter_vm_ovf_disk_gb | int) * 1024 * 1024

    - name: Power the VM on
      community.vmware.vmware_guest_powerstate:
        name: "{{ vcenter_vm_ovf_name }}"
        state: powered-on

    - name: Wait for VMware Tools to report an IPv4 address
      community.vmware.vmware_guest_info:
        name: "{{ vcenter_vm_ovf_name }}"
      register: _vm_info
      until: (_vm_info.instance.ipv4 | default('', true)) | length > 0
      retries: "{{ vcenter_vm_ovf_ip_retries }}"
      delay: "{{ vcenter_vm_ovf_ip_delay }}"

- name: Publish the VM's address
  ansible.builtin.set_fact:
    vcenter_vm_ovf_ip: "{{ _vm_info.instance.ipv4 }}"
