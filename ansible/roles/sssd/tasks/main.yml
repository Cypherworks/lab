---
# Identity-only SSSD: installs SSSD, writes the LDAP config + CA, points NSS at it.
# No PAM, no sshd — cannot affect login or sudo. Verify with `id <user>` / `getent`.
- name: Install SSSD and LDAP client packages
  become: true
  ansible.builtin.apt:
    name: "{{ sssd_packages }}"
    state: present
    update_cache: true

# AppArmor-confined sssd_be can't read a private cacert; use the system trust.
- name: Trust the OpenBao CA system-wide
  become: true
  ansible.builtin.copy:
    content: "{{ sssd_ldap_ca_cert }}"
    dest: /usr/local/share/ca-certificates/openbao-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: sssd_system_ca
  notify: Restart sssd

- name: Rebuild the system CA trust
  become: true
  ansible.builtin.command: update-ca-certificates
  when: sssd_system_ca.changed
  changed_when: true

- name: Render the SSSD config
  become: true
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    # 0600 is mandatory — sssd refuses to start on a looser config, and it holds the
    # bind app password.
    mode: "0600"
  notify: Restart sssd

- name: Point NSS at SSSD for passwd/group
  become: true
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: "^{{ item.db }}:"
    line: "{{ item.db }}: {{ item.value }}"
  loop: "{{ sssd_nsswitch }}"
  loop_control:
    label: "{{ item.db }}"

- name: Enable and start SSSD
  become: true
  ansible.builtin.systemd_service:
    name: sssd
    enabled: true
    state: started

# These sockets exit 17 beside `services =`; see the README for why it stays.
- name: Disable the sockets of the responders the monitor starts
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: "{{ sssd_monitor_started_sockets }}"
  register: sssd_disable_socket
  # Debian 13's sssd 2.10 ships no sssd-pam-priv.socket.
  failed_when: >-
    sssd_disable_socket is failed and 'Could not find the requested service'
    not in sssd_disable_socket.msg | default('')

- name: Clear the failure those sockets left behind
  become: true
  ansible.builtin.command: "systemctl reset-failed {{ item }}"
  loop: "{{ sssd_monitor_started_sockets }}"
  register: sssd_reset_failed
  changed_when: false
  # systemd drops a healthy unit it has no reason to keep loaded.
  failed_when: sssd_reset_failed.rc != 0 and 'not loaded' not in sssd_reset_failed.stderr

# --- PAM login/sudo — CONNECTIVITY-SENSITIVE, only when explicitly enabled ----
# Wires pam_sss (sudo password against Authentik, ssh-users access gate) and
# pam_mkhomedir (auto home dirs). Local root/ansible are unaffected (unknown to
# SSSD → pam_unix admits them; key-based SSH never hits the PAM auth stack).
- name: Configure PAM for SSSD login/sudo
  when: sssd_enable_pam_auth | bool
  block:
    - name: Ensure the SSSD + mkhomedir PAM modules are installed
      become: true
      ansible.builtin.apt:
        name:
          - libpam-sss
          - libpam-modules   # provides pam_mkhomedir + its pam-config
        state: present

    - name: Check whether the mkhomedir PAM profile is already active
      become: true
      ansible.builtin.command: grep -q pam_mkhomedir.so /etc/pam.d/common-session
      register: sssd_mkhomedir_active
      changed_when: false
      failed_when: false

    # pam-auth-update is Debian's sanctioned, reversible way to edit the common-*
    # stack (keeps pam_unix, so local accounts still authenticate). Guarded so it's
    # idempotent. NOTE: on CIS-hardened hosts, verify the faillock/pwquality config
    # still composes after this — check at the rig with a held root session.
    - name: Enable the SSSD + mkhomedir PAM profiles
      become: true
      ansible.builtin.command: "pam-auth-update --enable {{ sssd_pam_profiles | join(' ') }}"
      when: sssd_mkhomedir_active.rc != 0
      changed_when: true

    # Passwordless sudo for LDAP admins: cert-auth logins have no password.
    - name: Grant passwordless sudo to the LDAP sudo group
      become: true
      ansible.builtin.copy:
        content: "%{{ sssd_sudo_group }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ sssd_sudo_group }}"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"
      when: sssd_sudo_group | length > 0
