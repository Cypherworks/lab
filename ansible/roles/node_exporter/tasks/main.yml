---
# Prometheus node_exporter on hosts and Incus instances. Debian's package
# ships a hardened systemd unit; the default collectors include hwmon and
# thermal_zone, which give CPU temperature on the x86 ThinkCentres (coretemp
# via hwmon) and the ARM Pis (thermal_zone), the priority given the heat. A
# container sees its host's sensors, so instances pick their collectors
# through node_exporter_extra_args.
# Its Recommends, named so a no-Recommends host still gets apt.prom and units.
- name: Install node_exporter, the collectors and dbus
  become: true
  ansible.builtin.apt:
    name:
      - prometheus-node-exporter
      - prometheus-node-exporter-collectors
      - dbus
    state: present
    update_cache: true
    cache_valid_time: 3600

# Bind to the host's lab address, not 0.0.0.0 — metrics are reachable only from the
# lab network, never any other interface. The collector set is left at the package
# default (includes hwmon/thermal for temps); extra flags go in node_exporter_extra_args.
- name: Configure node_exporter listen address
  become: true
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by the node_exporter role.
      ARGS="--web.listen-address={{ node_exporter_listen_address }}:{{ node_exporter_port }} {{ node_exporter_extra_args }}"
  notify: Restart node_exporter

# Bind races the network at boot (it listens on the lab IP, up late), so order it
# after the network and retry until the address exists — otherwise a reboot leaves it
# dead and the host shows down in monitoring.
- name: Ensure the node_exporter service drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the node_exporter boot-order + retry override
  become: true
  ansible.builtin.template:
    src: node-exporter-override.conf.j2
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

# The collectors' apt timer runs this in place of their own apt_info.py.
- name: Run the role's apt_info.py in place of the package's
  when: node_exporter_apt_info_override | bool
  become: true
  block:
    - name: Install the role's apt_info.py
      ansible.builtin.copy:
        src: apt_info.py
        dest: /usr/local/sbin/prometheus-node-exporter-apt-info
        owner: root
        group: root
        mode: "0755"

    - name: Ensure the apt collector drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/prometheus-node-exporter-apt.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Point the apt collector at the role's apt_info.py
      ansible.builtin.copy:
        src: apt-info.dropin.conf
        dest: /etc/systemd/system/prometheus-node-exporter-apt.service.d/10-apt-info.conf
        owner: root
        group: root
        mode: "0644"

- name: Hand the apt collector back to the package's apt_info.py
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/prometheus-node-exporter-apt.service.d/10-apt-info.conf
    - /usr/local/sbin/prometheus-node-exporter-apt-info
  when: not (node_exporter_apt_info_override | bool)

# The systemd collector reads units over dbus; a fresh install leaves it down.
- name: Start dbus
  become: true
  ansible.builtin.systemd_service:
    name: dbus.service
    state: started

- name: Enable and start node_exporter
  become: true
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true
