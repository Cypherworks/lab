---
# claude-config is the box's ~/.claude (rules, hooks, settings, statusline).
- name: Clone claude-config into the claude user's ~/.claude
  become: true
  become_user: "{{ claude_user }}"
  ansible.builtin.git:
    repo: "{{ claude_config_repo }}"
    dest: "{{ claude_home }}/.claude"
    version: main
    update: false
  environment:
    CW_CLAUDE_APP_ID: "{{ claude_github_app_id }}"
    CW_CLAUDE_APP_KEY: "{{ claude_github_app_key_path }}"
