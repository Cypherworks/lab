---
# Dedicated workbench user: owns the repos, secrets, and Claude Code state.
# Humans SSH in as their Authentik identity, then `sudo -iu claude`; `claude`
# launch alias lives in /etc/profile.d (see below).
- name: Create the claude workbench user
  become: true
  ansible.builtin.user:
    name: "{{ claude_user }}"
    home: "{{ claude_home }}"
    shell: /bin/bash
    create_home: true
    comment: Claude workbench

- name: Permit the SSH-login group to become the claude user (only), no password
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/claude-workbench
    content: "%{{ claude_operator_group }} ALL=({{ claude_user }}) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Install the `claude` launch alias for all login shells
  become: true
  ansible.builtin.copy:
    dest: /etc/profile.d/claude-workbench.sh
    content: |
      # `claude` launches Claude Code as the workbench user (guarded).
      [ "$(id -un)" = "{{ claude_user }}" ] || alias claude='sudo -iu {{ claude_user }} claude'
    owner: root
    group: root
    mode: "0644"

# --- credentials, from group_vars/claude.sops.yml ----------------------------
- name: Create the cw-claude config directory (holds the App private key)
  become: true
  ansible.builtin.file:
    path: "{{ claude_github_app_key_path | dirname }}"
    state: directory
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0700"
  when: claude_github_app_private_key | length > 0

- name: Install the cw-claude GitHub App private key
  become: true
  ansible.builtin.copy:
    dest: "{{ claude_github_app_key_path }}"
    content: "{{ claude_github_app_private_key }}"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0600"
  no_log: true
  when: claude_github_app_private_key | length > 0

- name: Render the workbench environment (App token env + Claude Code token)
  become: true
  ansible.builtin.template:
    src: workbench.env.j2
    dest: "{{ claude_home }}/.workbench-env"
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0600"
  when: (claude_github_app_id | length > 0 and claude_github_app_private_key | length > 0) or claude_oauth_token | length > 0

# .profile not .bashrc: .bashrc's non-interactive guard would skip the token.
- name: Source the workbench environment from the claude user's login shell
  become: true
  ansible.builtin.lineinfile:
    path: "{{ claude_home }}/.profile"
    line: "[ -r ~/.workbench-env ] && . ~/.workbench-env"
    create: true
    owner: "{{ claude_user }}"
    group: "{{ claude_user }}"
    mode: "0644"

# ~/.claude.json is gitignored runtime; seed it, then Claude Code owns it.
- name: Mark Claude Code onboarding complete so first launch skips theme + login
  become: true
  become_user: "{{ claude_user }}"
  ansible.builtin.copy:
    dest: "{{ claude_home }}/.claude.json"
    content: |
      {"hasCompletedOnboarding": true}
    mode: "0600"
    force: false

- name: Configure git for the claude user (identity + GitHub auth via the App)
  become: true
  become_user: "{{ claude_user }}"
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ claude_home }}/.gitconfig"
    mode: "0644"

- name: Clone the working repos as the claude user
  become: true
  become_user: "{{ claude_user }}"
  ansible.builtin.git:
    repo: "{{ item.url }}"
    dest: "{{ claude_home }}/git/cw/{{ item.name }}"
    version: main
    update: false
  environment:
    CW_CLAUDE_APP_ID: "{{ claude_github_app_id }}"
    CW_CLAUDE_APP_KEY: "{{ claude_github_app_key_path }}"
  loop: "{{ claude_repos }}"
  loop_control:
    label: "{{ item.name }}"
  when: claude_github_app_id | length > 0 and claude_github_app_private_key | length > 0

# So a local `git commit` runs the repo's pre-commit hooks, not just CI.
- name: Register the pre-commit git hook in each cloned repo
  become: true
  become_user: "{{ claude_user }}"
  ansible.builtin.command:
    cmd: pre-commit install
    chdir: "{{ claude_home }}/git/cw/{{ item.name }}"
    creates: "{{ claude_home }}/git/cw/{{ item.name }}/.git/hooks/pre-commit"
  loop: "{{ claude_repos }}"
  loop_control:
    label: "{{ item.name }}"
  when: claude_github_app_id | length > 0 and claude_github_app_private_key | length > 0
