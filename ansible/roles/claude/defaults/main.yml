---
# The AI-assisted development workbench toolchain. Pin the binary versions to a
# current release and keep them level with the CI images, so pre-push checks
# match CI.
claude_go_version: "1.25.12"
claude_terraform_version: "1.11.4"
claude_actionlint_version: "1.7.7"

# Distro packages; openssh-server (the cloud image ships only the client).
claude_apt_packages:
  - openssh-server
  - git
  - tmux
  - jq
  - curl
  - ca-certificates
  - unzip
  - build-essential
  - python3
  - python3-pip
  - pipx
  - shellcheck
  - nodejs
  - npm
  - ansible
  - ansible-lint
  - yamllint

# Not packaged for Debian; pipx installs it isolated in /usr/local/bin.
claude_pipx_packages:
  - checkov
  - pre-commit

# Claude Code, from npm. Auth = CLAUDE_CODE_OAUTH_TOKEN (SOPS), headless box.
claude_code_package: "@anthropic-ai/claude-code"

# --- workbench user: owns the repos, secrets, and Claude Code state ---
claude_user: claude
claude_home: /home/claude
# SSH-login LDAP group allowed to become claude (NOPASSWD), not the admins.
claude_operator_group: ssh-users
# Git identity for the workbench's commits.
claude_git_user_name: "Claude Workbench"
claude_git_user_email: "claude@cypherworks.co.uk"
# Repos cloned into ~/git/cw (private — pulled with the cw-claude App token).
claude_repos:
  - { name: lab, url: "https://github.com/Cypherworks/lab.git" }
  - { name: lab-deploy, url: "https://github.com/Cypherworks/lab-deploy.git" }

# Secrets, from group_vars/claude.sops.yml. Empty = credential wiring skipped.
claude_oauth_token: ""
# cw-claude GitHub App: the box's whole GitHub identity (replaces PAT + key).
claude_github_app_id: ""
claude_github_app_private_key: ""
# Where the app private key is written on the box (0600), for cw-claude-token.
claude_github_app_key_path: "{{ claude_home }}/.config/cw-claude/app.pem"
# PR reviewer + assignee login for cw-claude-pr (empty = don't set a reviewer).
claude_github_reviewer: ""

# --- claude-config: cloned as ~/.claude (rules, hooks). Empty skips. ---
claude_config_repo: ""
