---
# Runs the compose's vmalert-logs as rendered, with real VictoriaLogs and
# vmsingle, and feeds VictoriaLogs known lines, some as USG syslog over UDP.
# Checks each recording rule counts its lines by host into vmsingle, that the
# firewall's drops are counted and its accepts aren't, and that vmalert-logs
# and the syslog listener are left out of the compose when unset. Needs Docker,
# and internet for the images.
# From ansible/:
#
#   ansible-playbook -i localhost, roles/monitoring/tests/log_rules.yml
- name: Verify the log recording rules
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _net: monitoring-logrules-test
    _vl: monitoring-logrules-victorialogs
    _vm: monitoring-logrules-vmsingle
    _vmalert: monitoring-logrules-vmalert
    _dir: "{{ playbook_dir }}/.log_rules"
    _rules:
      monitoring_log_rules_interval: 15s
      monitoring_victorialogs_syslog_port: 514
      monitoring_log_rules:
        - record: test_ssh_failures
          expr: '_SYSTEMD_UNIT:ssh.service "Failed password" | stats by (host) count() lines'
        - record: test_lines
          expr: '* | stats by (host) count() lines'
        - record: test_fw_drops
          expr: 'app_name:kernel ~"-D\\] ?IN=" | stats count() drops'
    _ingest: |
      import datetime, json, sys, urllib.request
      now = datetime.datetime.now(datetime.timezone.utc).isoformat()
      lines = [("a", "ssh.service", "Failed password for root from 192.0.2.7 port 4 ssh2")] * 3
      lines += [("b", "ssh.service", "Failed password for admin from 192.0.2.8 port 5 ssh2")] * 2
      lines += [("a", "ssh.service", "Accepted publickey for ansible from 192.0.2.9 port 6 ssh2")]
      lines += [("c", "cron.service", "Failed password is not a sshd line")]
      body = "\n".join(json.dumps({"_time": now, "host": h, "_SYSTEMD_UNIT": u, "_msg": m}) for h, u, m in lines)
      url = "http://victorialogs:9428/insert/jsonline?_stream_fields=host,_SYSTEMD_UNIT"
      headers = {"Content-Type": "application/stream+json"}  # a form type would be parsed as a form
      urllib.request.urlopen(urllib.request.Request(url, data=body.encode(), method="POST", headers=headers), timeout=10)
      import socket
      # A year-old RFC3164 stamp: only a listener stamping on receipt counts these now.
      usg = [
          "<4>Jan  1 00:00:00 usg kernel: [LAN_IN-2900-D] IN=eth1.40 OUT=eth1.20 SRC=192.0.2.10 DST=192.0.2.20 PROTO=TCP SPT=1 DPT=22",
          "<4>Jan  1 00:00:00 usg kernel: [LAN_LOCAL-2000-D]IN=eth1.55 OUT= SRC=192.0.2.11 DST=192.0.2.1 PROTO=TCP SPT=2 DPT=443",
          "<4>Jan  1 00:00:00 usg kernel: [LAN_IN-2010-A] IN=eth1.40 OUT=eth1.20 SRC=192.0.2.10 DST=192.0.2.20 PROTO=TCP SPT=3 DPT=445",
          "<6>Jan  1 00:00:00 usg dhcpd: DHCPACK on 192.0.2.12 to 00:00:5e:00:53:01 via eth1.40",
      ]
      udp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
      for line in usg:
          udp.sendto(line.encode(), ("victorialogs", 514))
    _recorded: |
      import json, time, urllib.parse, urllib.request
      url = "http://vmsingle:8428/api/v1/export?" + urllib.parse.urlencode({"match[]": '{__name__=~"test_.*"}'})
      seen = {}
      for _ in range(60):
          seen = {}
          for line in urllib.request.urlopen(url, timeout=10).read().decode().splitlines():
              s = json.loads(line)
              key = s["metric"]["__name__"] + "|" + s["metric"].get("host", "")
              # vmalert's staleness markers export as null.
              seen[key] = max([seen.get(key, 0)] + [v for v in s["values"] if v is not None])
          if seen.get("test_ssh_failures|b") and seen.get("test_lines|c") and seen.get("test_fw_drops|"):
              break
          time.sleep(3)
      rules = json.load(urllib.request.urlopen("http://vmalert-logs:8880/api/v1/rules", timeout=10))
      states = [(r["name"], r.get("lastError", ""), r.get("lastSamples")) for g in rules["data"]["groups"] for r in g["rules"]]
      logged = urllib.request.urlopen("http://victorialogs:9428/select/logsql/query?" + urllib.parse.urlencode(
          {"query": "_time:1h | stats count() n"}), timeout=10).read().decode().strip()
      print(json.dumps({"seen": seen, "rules": states, "logged": logged}))
  tasks:
    - name: Read the role's defaults
      ansible.builtin.include_vars:
        file: ../defaults/main.yml

    - name: Clear what a failed run left behind
      ansible.builtin.shell: >-
        docker rm -f {{ _vl }} {{ _vm }} {{ _vmalert }} 2>/dev/null;
        docker network rm {{ _net }} 2>/dev/null; true
      changed_when: false

    - name: Render the compose with and without log rules
      ansible.builtin.set_fact:
        _with: "{{ lookup('ansible.builtin.template', '../templates/compose.yaml.j2', template_vars=_rules) | from_yaml }}"
        _without: "{{ lookup('ansible.builtin.template', '../templates/compose.yaml.j2') | from_yaml }}"

    - name: Create the working directory
      ansible.builtin.file:
        path: "{{ _dir }}"
        state: directory
        mode: "0755"

    - name: Render the role's log rules
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', '../templates/log-rules.yml.j2', template_vars=_rules) }}"
        dest: "{{ _dir }}/log-rules.yml"
        mode: "0644"

    - name: Run the stack and count
      block:
        - name: Make the test network
          ansible.builtin.command: docker network create {{ _net }}
          changed_when: true

        - name: Start VictoriaLogs with the compose's image and command
          vars:
            _service: "{{ _with.services.victorialogs }}"
          ansible.builtin.command:
            argv: "{{ ['docker', 'run', '-d', '--name', _vl, '--network', _net,
                       '--network-alias', 'victorialogs', _service.image] + _service.command }}"
          changed_when: true

        - name: Start vmsingle as the compose names it
          ansible.builtin.command: >-
            docker run -d --name {{ _vm }} --network {{ _net }} --network-alias vmsingle {{ monitoring_vmsingle_image }}
          changed_when: true

        - name: Start vmalert-logs with the compose's image, rules file and command
          vars:
            _service: "{{ _with.services['vmalert-logs'] }}"
            _target: "{{ _service.volumes | select('search', 'log-rules.yml') | first | split(':') }}"
          ansible.builtin.command:
            argv: "{{ ['docker', 'run', '-d', '--name', _vmalert, '--network', _net,
                       '--network-alias', 'vmalert-logs',
                       '-v', _dir ~ '/log-rules.yml:' ~ _target[1] ~ ':ro', _service.image] + _service.command }}"
          changed_when: true

        - name: Wait for VictoriaLogs to take lines
          ansible.builtin.command:
            argv: [docker, run, --rm, --network, "{{ _net }}", python:3.13-alpine, python3, -c, "{{ _ingest }}"]
          register: _ingested
          until: _ingested.rc == 0
          retries: 20
          delay: 2
          changed_when: true

        - name: Read what the rules recorded
          ansible.builtin.command:
            argv: [docker, run, --rm, --network, "{{ _net }}", python:3.13-alpine, python3, -c, "{{ _recorded }}"]
          register: _recorded_out
          changed_when: false

        - name: Keep vmalert-logs' log for a failure
          ansible.builtin.command: docker logs --tail 20 {{ _vmalert }}
          register: _vmalert_log
          changed_when: false
      always:
        - name: Remove the containers and network
          ansible.builtin.shell: >-
            docker rm -f {{ _vl }} {{ _vm }} {{ _vmalert }} 2>/dev/null;
            docker network rm {{ _net }} 2>/dev/null; true
          changed_when: true

        - name: Remove the working directory
          ansible.builtin.file:
            path: "{{ _dir }}"
            state: absent

    - name: Assert each rule counted its lines, and unset means no vmalert-logs and no syslog
      vars:
        _seen: "{{ (_recorded_out.stdout | from_json).seen }}"
      ansible.builtin.assert:
        that:
          - "'vmalert-logs' not in _without.services"
          - _seen.get('test_ssh_failures|a') == 3
          - _seen.get('test_ssh_failures|b') == 2
          - "'test_ssh_failures|c' not in _seen"
          - _seen.get('test_lines|a') == 4
          - _seen.get('test_lines|c') == 1
          - _seen.get('test_fw_drops|') == 2
          - "'514:514/udp' in _with.services.victorialogs.ports"
          - _without.services.victorialogs.ports == ['9428:9428']
          - _without.services.victorialogs.command | select('search', 'syslog') | list == []
        fail_msg: "{{ _recorded_out.stdout }} {{ _vmalert_log.stdout_lines | default([]) }} {{ _vmalert_log.stderr_lines | default([]) }}"
