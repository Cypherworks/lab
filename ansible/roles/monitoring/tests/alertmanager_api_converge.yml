---
# Runs the role's Alertmanager API tasks on alertmanager_api.yml's container.
# A stand-in handler counts restarts, as there is no compose stack to restart.
- name: Converge the Alertmanager API auth
  hosts: all
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_become: false
  tasks:
    - name: Read the role's defaults
      ansible.builtin.include_vars:
        file: ../defaults/main.yml

    - name: Make the secrets directory as the role does
      ansible.builtin.file:
        path: "{{ monitoring_config_dir }}/alertmanager-secrets"
        state: directory
        owner: "{{ monitoring_alertmanager_uid }}"
        group: root
        mode: "0500"

    - name: Run the role's tasks
      ansible.builtin.include_tasks: ../tasks/alertmanager_api.yml

  handlers:
    - name: Restart monitoring
      ansible.builtin.debug:
        msg: restart requested
