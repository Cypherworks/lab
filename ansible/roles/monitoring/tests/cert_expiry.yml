---
# Runs the role's rendered alert rules through promtool against made-up probe
# data: a cert close to expiry, on a URL and on a node, one with plenty of
# time, and a target whose probe has stopped reporting. Needs Docker, and internet to pull the image
# once. From ansible/:
#
#   ansible-playbook -i localhost, roles/monitoring/tests/cert_expiry.yml
- name: Verify the cert expiry alerts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _dir: "{{ playbook_dir }}/.cert_expiry"
    _image: prom/prometheus:v2.53.4
    _day: 86400
    _spec: |
      rule_files:
        - alert-rules.yml
      evaluation_interval: 1m
      tests:
        - name: a cert inside the window fires, and one outside it doesn't
          interval: 1m
          input_series:
            - series: 'probe_ssl_earliest_cert_expiry{instance="https://soon.example.test"}'
              values: '{{ 10 * _day }}+0x180'
            - series: 'probe_ssl_earliest_cert_expiry{instance="https://fine.example.test"}'
              values: '{{ 45 * _day }}+0x180'
            - series: 'probe_ssl_earliest_cert_expiry{instance="node-1"}'
              values: '{{ 45 * _day }}+0x180'
          alert_rule_test:
            - eval_time: 2h
              alertname: CertExpiringSoon
              exp_alerts:
                - exp_labels:
                    severity: warning
                    instance: https://soon.example.test
                    host: soon
                  exp_annotations:
                    summary: "TLS cert expiring soon: soon"
                    description: "Under {{ monitoring_cert_expiry_warn_days }} days left, so renewal has been failing."
            - eval_time: 2h
              alertname: CertNotProbed
        - name: a node's cert inside the window fires under the node's name
          interval: 1m
          input_series:
            - series: 'probe_ssl_earliest_cert_expiry{instance="https://soon.example.test"}'
              values: '{{ 45 * _day }}+0x180'
            - series: 'probe_ssl_earliest_cert_expiry{instance="https://fine.example.test"}'
              values: '{{ 45 * _day }}+0x180'
            - series: 'probe_ssl_earliest_cert_expiry{instance="node-1"}'
              values: '{{ 10 * _day }}+0x180'
          alert_rule_test:
            - eval_time: 2h
              alertname: CertExpiringSoon
              exp_alerts:
                - exp_labels:
                    severity: warning
                    instance: node-1
                    host: node-1
                  exp_annotations:
                    summary: "TLS cert expiring soon: node-1"
                    description: "Under {{ monitoring_cert_expiry_warn_days }} days left, so renewal has been failing."
        - name: a target that stops reporting fires, counting node targets
          interval: 1m
          input_series:
            - series: 'probe_ssl_earliest_cert_expiry{instance="https://fine.example.test"}'
              values: '{{ 45 * _day }}+0x180'
            - series: 'probe_ssl_earliest_cert_expiry{instance="node-1"}'
              values: '{{ 45 * _day }}+0x180'
          alert_rule_test:
            - eval_time: 2h
              alertname: CertNotProbed
              exp_alerts:
                - exp_labels:
                    severity: warning
                  exp_annotations:
                    summary: "TLS cert probe not reporting"
                    description: "Fewer targets reporting a cert than configured, so an expiry could go unseen."
        - name: a cert file inside its renewal window fires, and one outside doesn't
          interval: 1m
          input_series:
            - series: 'tls_cert_not_after_seconds{cert="postgres", instance="pg-1"}'
              values: '{{ 20 * _day }}+0x180'
            - series: 'tls_cert_not_after_seconds{cert="postgres", instance="pg-2"}'
              values: '{{ 45 * _day }}+0x180'
          alert_rule_test:
            - eval_time: 2h
              alertname: CertRenewalDue
              exp_alerts:
                - exp_labels:
                    severity: warning
                    cert: postgres
                    instance: pg-1
                  exp_annotations:
                    summary: "TLS cert renewal due: postgres on pg-1"
                    description: "Under {{ monitoring_cert_file_renew_days }} days left; the play that deploys it reissues it."
  tasks:
    - name: Read the role's defaults
      ansible.builtin.include_vars:
        file: ../defaults/main.yml

    - name: Point the role at two URLs and a node
      ansible.builtin.set_fact:
        monitoring_blackbox_targets: ["https://soon.example.test", "https://fine.example.test"]
        monitoring_blackbox_node_tls_targets:
          - { target: "192.0.2.1:443", instance: node-1 }

    - name: Create the working directory
      ansible.builtin.file:
        path: "{{ _dir }}"
        state: directory
        mode: "0755"

    - name: Render the role's rules
      ansible.builtin.template:
        src: ../templates/alert-rules.yml.j2
        dest: "{{ _dir }}/alert-rules.yml"
        mode: "0644"

    - name: Write the test cases
      ansible.builtin.copy:
        content: "{{ _spec }}"
        dest: "{{ _dir }}/rules_test.yml"
        mode: "0644"

    - name: Run promtool
      ansible.builtin.command: >-
        docker run --rm -v {{ _dir }}:/work -w /work --entrypoint promtool
        {{ _image }} test rules rules_test.yml
      register: _promtool
      changed_when: false
      failed_when: false

    - name: Load the rules in vmalert, the engine that runs them
      ansible.builtin.command: >-
        docker run --rm -v {{ _dir }}:/work {{ monitoring_vmalert_image }}
        -rule=/work/alert-rules.yml -dryRun
      register: _vmalert
      changed_when: false
      failed_when: false

    - name: Remove the working directory
      ansible.builtin.file:
        path: "{{ _dir }}"
        state: absent

    - name: Assert the alerts behave
      ansible.builtin.assert:
        that:
          - _promtool.rc == 0
          - _vmalert.rc == 0
        fail_msg: "{{ _promtool.stdout }} {{ _promtool.stderr }} {{ _vmalert.stderr }}"
