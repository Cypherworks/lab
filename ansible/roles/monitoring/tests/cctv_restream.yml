---
# Checks the rendered go2rtc config: with transcoding on, viewers can only get
# the re-encoded stream. A camera that already sends H.264 would otherwise be
# served raw, with no parameter sets in its SDP, and MSE shows it at 4:3.
# From ansible/:
#
#   ansible-playbook -i localhost, roles/monitoring/tests/cctv_restream.yml
- name: Verify the CCTV restream
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Read the role's defaults
      ansible.builtin.include_vars:
        file: ../defaults/main.yml

    - name: Make a scratch dir
      ansible.builtin.tempfile:
        state: directory
        suffix: .monitoring
      register: _scratch

    - name: Render and check, then clean up
      block:
        - name: Render the config without transcoding
          ansible.builtin.template:
            src: ../templates/go2rtc.yaml.j2
            dest: "{{ _scratch.path }}/plain.yaml"
            mode: "0644"

        - name: Turn transcoding on
          ansible.builtin.set_fact:
            monitoring_go2rtc_video_transcode: true

        - name: Render the config with transcoding
          ansible.builtin.template:
            src: ../templates/go2rtc.yaml.j2
            dest: "{{ _scratch.path }}/transcoded.yaml"
            mode: "0644"

        - name: Limit the frame rate
          ansible.builtin.set_fact:
            monitoring_go2rtc_video_fps: 10

        - name: Render the config with a frame rate limit
          ansible.builtin.template:
            src: ../templates/go2rtc.yaml.j2
            dest: "{{ _scratch.path }}/limited.yaml"
            mode: "0644"

        - name: Set a video filter on each camera
          ansible.builtin.set_fact:
            monitoring_go2rtc_front_video_filter: "drawbox=x=596:y=9:w=308:h=33:color=0x110d0c@0.6:t=fill,delogo=x=1269:y=391:w=251:h=31"
            monitoring_go2rtc_garage_carport_video_filter: "delogo=x=611:y=471:w=282:h=38"

        - name: Render the config with video filters
          ansible.builtin.template:
            src: ../templates/go2rtc.yaml.j2
            dest: "{{ _scratch.path }}/filtered.yaml"
            mode: "0644"

        - name: Turn transcoding off with the filters still set
          ansible.builtin.set_fact:
            monitoring_go2rtc_video_transcode: false

        - name: Render the config with filters but no transcoding
          ansible.builtin.template:
            src: ../templates/go2rtc.yaml.j2
            dest: "{{ _scratch.path }}/filtered_plain.yaml"
            mode: "0644"

        - name: Assert viewers get the camera directly without transcoding
          vars:
            _streams: "{{ (lookup('ansible.builtin.file', _scratch.path ~ '/plain.yaml') | from_yaml).streams }}"
          ansible.builtin.assert:
            that:
              - _streams | length == 2
              - _streams.front == ['${GO2RTC_FRONT_URL}']
              - _streams.garage_carport == ['${GO2RTC_GARAGE_CARPORT_URL}']
            fail_msg: "{{ _streams | to_json }}"

        - name: Assert viewers only get the re-encoded stream with transcoding
          vars:
            _streams: "{{ (lookup('ansible.builtin.file', _scratch.path ~ '/transcoded.yaml') | from_yaml).streams }}"
          ansible.builtin.assert:
            that:
              - _streams.front == ['ffmpeg:front_source#video=h264']
              - _streams.front_source == ['${GO2RTC_FRONT_URL}']
              - _streams.garage_carport == ['ffmpeg:garage_carport_source#video=h264']
              - _streams.garage_carport_source == ['${GO2RTC_GARAGE_CARPORT_URL}']
            fail_msg: "{{ _streams | to_json }}"

        - name: Assert the limit reaches ffmpeg for both cameras
          vars:
            _streams: "{{ (lookup('ansible.builtin.file', _scratch.path ~ '/limited.yaml') | from_yaml).streams }}"
          ansible.builtin.assert:
            that:
              - _streams.front == ['ffmpeg:front_source#video=h264#raw=-r 10']
              - _streams.garage_carport == ['ffmpeg:garage_carport_source#video=h264#raw=-r 10']
            fail_msg: "{{ _streams | to_json }}"

        # The MSE player keeps 5s and drops a whole keyframe group at a time.
        - name: Assert a limited rate keeps keyframes 2 seconds apart
          vars:
            _config: "{{ lookup('ansible.builtin.file', _scratch.path ~ '/limited.yaml') | from_yaml }}"
          ansible.builtin.assert:
            that:
              - _config.ffmpeg.h264 == '-c:v libx264 -g 20 -profile:v high -level:v 4.1 -preset:v superfast -tune:v zerolatency -pix_fmt:v yuv420p'
            fail_msg: "{{ _config | to_json }}"

        - name: Assert each camera's filter reaches its own ffmpeg
          vars:
            _streams: "{{ (lookup('ansible.builtin.file', _scratch.path ~ '/filtered.yaml') | from_yaml).streams }}"
          ansible.builtin.assert:
            that:
              - _streams.front == ['ffmpeg:front_source#video=h264#raw=-r 10#raw=-vf drawbox=x=596:y=9:w=308:h=33:color=0x110d0c@0.6:t=fill,delogo=x=1269:y=391:w=251:h=31']
              - _streams.garage_carport == ['ffmpeg:garage_carport_source#video=h264#raw=-r 10#raw=-vf delogo=x=611:y=471:w=282:h=38']
            fail_msg: "{{ _streams | to_json }}"

        # A filter needs decoded frames, so the raw camera can't take one.
        - name: Assert filters need transcoding
          vars:
            _streams: "{{ (lookup('ansible.builtin.file', _scratch.path ~ '/filtered_plain.yaml') | from_yaml).streams }}"
          ansible.builtin.assert:
            that:
              - _streams.front == ['${GO2RTC_FRONT_URL}']
              - _streams.garage_carport == ['${GO2RTC_GARAGE_CARPORT_URL}']
            fail_msg: "{{ _streams | to_json }}"

        - name: Assert the camera's own rate keeps go2rtc's keyframe interval
          vars:
            _plain: "{{ lookup('ansible.builtin.file', _scratch.path ~ '/plain.yaml') | from_yaml }}"
            _transcoded: "{{ lookup('ansible.builtin.file', _scratch.path ~ '/transcoded.yaml') | from_yaml }}"
          ansible.builtin.assert:
            that:
              - "'ffmpeg' not in _plain"
              - "'ffmpeg' not in _transcoded"
            fail_msg: "{{ [_plain, _transcoded] | to_json }}"
      always:
        - name: Remove the scratch dir
          ansible.builtin.file:
            path: "{{ _scratch.path }}"
            state: absent
