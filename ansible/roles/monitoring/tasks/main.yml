---
# Docker itself comes from the shared `docker` role (meta dependency).
- name: Create the monitoring directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ monitoring_compose_dir }}"
    - "{{ monitoring_config_dir }}"
    - "{{ monitoring_config_dir }}/grafana/provisioning/datasources"
    - "{{ monitoring_config_dir }}/grafana/provisioning/dashboards"
    # Empty, but Grafana logs an error at every start if they're missing.
    - "{{ monitoring_config_dir }}/grafana/provisioning/plugins"
    - "{{ monitoring_config_dir }}/grafana/provisioning/alerting"
    - "{{ monitoring_config_dir }}/grafana/dashboards"
    - "{{ monitoring_config_dir }}/grafana/plugins"
    - "{{ monitoring_config_dir }}/alertmanager-templates"

- name: Create the Alertmanager secrets directory
  become: true
  ansible.builtin.file:
    path: "{{ monitoring_config_dir }}/alertmanager-secrets"
    state: directory
    owner: "{{ monitoring_alertmanager_uid }}"
    group: root
    mode: "0500"

- name: Write the URLs of the receivers outside the lab
  become: true
  ansible.builtin.copy:
    content: "{{ item.url }}"
    dest: "{{ monitoring_config_dir }}/alertmanager-secrets/{{ item.name }}"
    owner: "{{ monitoring_alertmanager_uid }}"
    group: root
    mode: "0400"
  loop: "{{ monitoring_alert_secret_files }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart monitoring

- name: Put Alertmanager's API behind basic auth
  ansible.builtin.include_tasks: alertmanager_api.yml
  when: monitoring_alertmanager_api_users | length > 0

- name: Remove the Alertmanager API auth files when it isn't published
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ monitoring_config_dir }}/alertmanager-api.htpasswd"
    - "{{ monitoring_config_dir }}/alertmanager-secrets/web.yml"
    - "{{ monitoring_config_dir }}/vmalert-notifier-password"
    - "{{ monitoring_config_dir }}/vmsingle-alertmanager-password"
  when: monitoring_alertmanager_api_users | length == 0
  notify: Restart monitoring

- name: Render the monitoring config files
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ monitoring_config_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: scrape.yml.j2, dest: scrape.yml }
    - { src: alert-rules.yml.j2, dest: alert-rules.yml }
    - { src: log-rules.yml.j2, dest: log-rules.yml }
    - { src: alertmanager.yml.j2, dest: alertmanager.yml }
    - { src: alert-text.tmpl.j2, dest: alertmanager-templates/alert-text.tmpl }
    - { src: blackbox.yml.j2, dest: blackbox.yml }
    - { src: snmp.yml.j2, dest: snmp.yml }
    - { src: go2rtc.yaml.j2, dest: go2rtc.yaml }
    - { src: grafana-datasource.yml.j2, dest: grafana/provisioning/datasources/datasource.yml }
    - { src: grafana-dashboards.yml.j2, dest: grafana/provisioning/dashboards/dashboards.yml }
    - { src: dashboards/lab-kiosk.json.j2, dest: grafana/dashboards/lab-kiosk.json }
  notify: Restart monitoring

- name: Remove dropped provisioned dashboards
  become: true
  ansible.builtin.file:
    path: "{{ monitoring_config_dir }}/grafana/dashboards/{{ item }}"
    state: absent
  loop:
    - cctv.json
    - lab-services-nas.json
    - lab-overview.json
  notify: Restart monitoring

- name: Remove dropped config files
  become: true
  ansible.builtin.file:
    path: "{{ monitoring_config_dir }}/{{ item }}"
    state: absent
  loop:
    - ntfy.yml
    - ntfy-alert.yml

- name: Render the HASS scrape token (0600 — docker-secret source for vmsingle)
  become: true
  ansible.builtin.template:
    src: hass_token.j2
    dest: "{{ monitoring_config_dir }}/hass_token"
    owner: root
    group: root
    mode: "0600"
  when: monitoring_hass_token | length > 0
  notify: Restart monitoring

- name: Render the Incus metrics client cert + key (0600 — docker-secret sources)
  become: true
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ monitoring_config_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { content: "{{ monitoring_incus_metrics_cert }}", dest: incus_metrics.crt }
    - { content: "{{ monitoring_incus_metrics_key }}", dest: incus_metrics.key }
  loop_control:
    label: "{{ item.dest }}"
  when: monitoring_incus_metrics_targets | length > 0
  no_log: true
  notify: Restart monitoring

- name: Render the monitoring env (secrets)
  become: true
  ansible.builtin.template:
    src: env.j2
    dest: "{{ monitoring_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart monitoring

- name: Render the monitoring compose
  become: true
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ monitoring_compose_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0600"
  notify: Restart monitoring

- name: Start the monitoring stack
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_compose_dir }}"
    state: present
    pull: missing
    # Stops the container of any service the compose doesn't define.
    remove_orphans: true

# Compose names volumes after the project, which is the compose directory.
- name: Remove dropped volumes
  become: true
  community.docker.docker_volume:
    name: "{{ monitoring_compose_dir | basename }}_{{ item }}"
    state: absent
  loop:
    - ntfycache
    - ntfydata
