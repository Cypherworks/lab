---
- name: Check the cluster settings
  ansible.builtin.assert:
    that:
      - patroni_members | length > 0
      - patroni_tls_service_name | length > 0
    fail_msg: postgres_patroni needs patroni_members and patroni_tls_service_name
    quiet: true

- name: Add the PGDG repository
  become: true
  ansible.builtin.deb822_repository:
    name: pgdg
    types: [deb]
    uris: http://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: [main]
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc

- name: Install PostgreSQL and Patroni prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - "postgresql-{{ patroni_postgres_version }}"
      - "postgresql-client-{{ patroni_postgres_version }}"
      - python3-venv
      - python3-pip
      - python3-psycopg2
      # The pip + community.postgresql modules import these from the system Python;
      # the minimal Debian cloud image doesn't ship them.
      - python3-packaging
    state: present
    update_cache: true

- name: Install Patroni (etcd3) into a venv
  become: true
  ansible.builtin.pip:
    name:
      - "patroni[etcd3]=={{ patroni_version }}"
      - psycopg2-binary
    virtualenv: "{{ patroni_venv }}"
    virtualenv_command: python3 -m venv

- name: Create the Patroni config directory
  become: true
  ansible.builtin.file:
    path: "{{ patroni_conf_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

# Guarded by the marker so a re-run can NEVER drop the cluster Patroni has since
# bootstrapped at the same data_dir. The marker is created in the same step.
- name: Remove the apt-created default cluster so Patroni bootstraps its own
  become: true
  ansible.builtin.shell:
    cmd: >-
      pg_dropcluster --stop {{ patroni_postgres_version }} main || true;
      touch {{ patroni_bootstrap_marker }}
    creates: "{{ patroni_bootstrap_marker }}"

- name: Stop and mask the distro postgresql service (Patroni owns Postgres)
  become: true
  ansible.builtin.systemd_service:
    name: postgresql
    state: stopped
    enabled: false
    masked: true

- name: Read the services' states
  ansible.builtin.service_facts:

- name: Note whether Patroni was running before this run
  ansible.builtin.set_fact:
    patroni_was_running: >-
      {{ ansible_facts.services['patroni.service'].state | default('') == 'running' }}

- name: Issue the server cert
  ansible.builtin.include_role:
    name: openbao_cert
  vars:
    openbao_cert_name: postgres
    openbao_cert_dir: "{{ patroni_tls_dir }}"
    openbao_cert_owner: postgres
    openbao_cert_group: postgres
    openbao_cert_common_name: "{{ patroni_tls_service_name }}"
    openbao_cert_dns_sans: []
    openbao_cert_ip_sans: ["{{ patroni_this_ip }}"]

- name: Have Postgres load a new cert
  ansible.builtin.debug:
    msg: A new server cert was issued
  changed_when: openbao_cert_needs_issue | bool
  when: openbao_cert_needs_issue | bool
  notify: Reload patroni

- name: Render the Patroni config
  become: true
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ patroni_config_file }}"
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Reload patroni

- name: Install the Patroni systemd unit
  become: true
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart patroni

- name: Apply config, cert and unit changes before going on
  ansible.builtin.meta: flush_handlers

- name: Enable and start Patroni
  become: true
  ansible.builtin.systemd_service:
    name: patroni
    enabled: true
    state: started
    daemon_reload: true

# Patroni applies a reload on its own loop, so wait for TLS to come up.
- name: Wait for Postgres to answer over TLS, verified by address
  community.postgresql.postgresql_ping:
    login_host: "{{ patroni_this_ip }}"
    login_user: postgres
    login_password: "{{ patroni_superuser_password }}"
    port: 5432
    ssl_mode: verify-full
    ca_cert: "{{ patroni_tls_dir }}/postgres-ca.crt"
  register: patroni_tls_ping
  until: patroni_tls_ping.is_available
  retries: 30
  delay: 5

- name: Wait for the cluster to elect a leader
  run_once: true
  ansible.builtin.uri:
    url: "http://{{ patroni_this_ip }}:{{ patroni_rest_port }}/cluster"
    return_content: true
  register: patroni_cluster
  retries: 30
  delay: 5
  until: >-
    patroni_cluster.json is defined and
    (patroni_cluster.json.members | default([]) | selectattr('role', 'equalto', 'leader') | list | length) > 0
  failed_when: false
  changed_when: false

- name: Identify the current leader address
  run_once: true
  ansible.builtin.set_fact:
    patroni_leader_ip: "{{ patroni_cluster.json.members | selectattr('role', 'equalto', 'leader') | map(attribute='host') | first }}"
  when:
    - patroni_cluster.json is defined
    - (patroni_cluster.json.members | default([]) | selectattr('role', 'equalto', 'leader') | list | length) > 0

- name: Create each database's owner (leader only, idempotent)
  run_once: true
  community.postgresql.postgresql_user:
    name: "{{ item.owner }}"
    password: "{{ item.password }}"
    conn_limit: "{{ item.conn_limit | default(-1) }}"
    login_host: "{{ patroni_leader_ip }}"
    login_user: postgres
    login_password: "{{ patroni_superuser_password }}"
    port: 5432
    ssl_mode: verify-full
    ca_cert: "{{ patroni_tls_dir }}/postgres-ca.crt"
  loop: "{{ patroni_databases }}"
  loop_control:
    label: "{{ item.owner }}"
  no_log: true
  when: patroni_leader_ip is defined

- name: Create each database (leader only, idempotent)
  run_once: true
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner }}"
    login_host: "{{ patroni_leader_ip }}"
    login_user: postgres
    login_password: "{{ patroni_superuser_password }}"
    port: 5432
    ssl_mode: verify-full
    ca_cert: "{{ patroni_tls_dir }}/postgres-ca.crt"
  loop: "{{ patroni_databases }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: patroni_leader_ip is defined
