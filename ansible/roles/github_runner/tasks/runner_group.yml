---
# Keeps github_runner_group in github_runner_org usable only by the
# repositories in github_runner_group_repository_ids, never by public repos:
# creates it when missing, and puts its visibility and repository list back
# when they drift. Runs once from the controller with the runner's token,
# which needs the org's Self-hosted runners permission (read and write).
- name: Require org scope and a group name for a managed runner group
  ansible.builtin.assert:
    that:
      - github_runner_scope == 'org'
      - github_runner_group | length > 0
    fail_msg: >-
      github_runner_group_repository_ids needs github_runner_scope org and a
      github_runner_group to limit.

- name: Read the org's runner groups
  ansible.builtin.include_tasks: github_api.yml
  vars:
    github_runner_api_method: GET
    github_runner_api_path: /orgs/{{ github_runner_org }}/actions/runner-groups?per_page=100
    github_runner_api_status: 200

- name: Find the runner group by name
  ansible.builtin.set_fact:
    github_runner_group_found: >-
      {{ github_runner_api_reply.json.runner_groups
         | selectattr('name', 'equalto', github_runner_group) | first | default({}) }}

- name: Create the runner group for the selected repositories
  ansible.builtin.include_tasks: github_api.yml
  vars:
    github_runner_api_method: POST
    github_runner_api_path: /orgs/{{ github_runner_org }}/actions/runner-groups
    github_runner_api_status: 201
    github_runner_api_body:
      name: "{{ github_runner_group }}"
      visibility: selected
      selected_repository_ids: "{{ github_runner_group_repository_ids }}"
      allows_public_repositories: false
  when: github_runner_group_found == {}

- name: Keep the runner group to selected, private repositories
  ansible.builtin.include_tasks: github_api.yml
  vars:
    github_runner_api_method: PATCH
    github_runner_api_path: /orgs/{{ github_runner_org }}/actions/runner-groups/{{ github_runner_group_found.id }}
    github_runner_api_status: 200
    github_runner_api_body:
      name: "{{ github_runner_group }}"
      visibility: selected
      allows_public_repositories: false
  when:
    - github_runner_group_found != {}
    - github_runner_group_found.visibility != 'selected' or github_runner_group_found.allows_public_repositories

- name: Read the runner group's repositories
  ansible.builtin.include_tasks: github_api.yml
  vars:
    github_runner_api_method: GET
    github_runner_api_path: /orgs/{{ github_runner_org }}/actions/runner-groups/{{ github_runner_group_found.id }}/repositories?per_page=100
    github_runner_api_status: 200
  when: github_runner_group_found != {}

- name: Set the runner group's repositories
  ansible.builtin.include_tasks: github_api.yml
  vars:
    github_runner_api_method: PUT
    github_runner_api_path: /orgs/{{ github_runner_org }}/actions/runner-groups/{{ github_runner_group_found.id }}/repositories
    github_runner_api_status: 204
    github_runner_api_body:
      selected_repository_ids: "{{ github_runner_group_repository_ids }}"
  when:
    - github_runner_group_found != {}
    - >-
      github_runner_api_reply.json.repositories | map(attribute='id') | sort
      != github_runner_group_repository_ids | sort
