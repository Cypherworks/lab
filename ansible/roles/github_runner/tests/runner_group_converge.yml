---
# The converge that runner_group.yml runs against its GitHub API stub. Not
# run by hand: it needs the stub that playbook starts.
- name: Ensure a runner group limited to selected repositories
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    # By path, not include_role, which would pull in the docker dependency.
    - name: Read the role's defaults
      ansible.builtin.include_vars:
        file: ../defaults/main.yml

    - name: Run the role's runner group tasks
      ansible.builtin.include_tasks: ../tasks/runner_group.yml
