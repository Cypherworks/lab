---
# Docker itself comes from the shared `docker` role (meta dependency).
- name: Create the upsnap directory
  become: true
  ansible.builtin.file:
    path: "{{ upsnap_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the upsnap compose
  become: true
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ upsnap_compose_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart upsnap

- name: Start the upsnap stack
  become: true
  community.docker.docker_compose_v2:
    project_src: "{{ upsnap_compose_dir }}"
    state: present
    pull: missing

- name: Set up the UpSnap superuser (OpenBao-backed, zero human input)
  ansible.builtin.include_tasks: superuser.yml
