---
# Mount the VCSA ISO read-only (macOS hdiutil) and derive the macOS installer
# path + the install-template schema version from it, each only when the deploy
# didn't pin one. The caller unmounts in an always block. macOS-only for now:
# hdiutil and the mac/ installer variant; a Linux control host needs its own
# mount + lin64/ branch (not built). Confirm the ISO layout on the box.
- name: Require the ISO path to deploy vCenter
  ansible.builtin.assert:
    that: vcsa_iso | length > 0
    fail_msg: "vcsa_iso must point at the VCSA installer ISO to deploy vCenter."

- name: Mount the VCSA ISO (read-only, no Finder)
  ansible.builtin.command:
    argv:
      - hdiutil
      - attach
      - -nobrowse
      - -readonly
      - -plist
      - "{{ vcsa_iso }}"
  register: vcsa_iso_attach
  changed_when: true

- name: Capture the ISO mount point
  ansible.builtin.set_fact:
    vcsa_iso_mount: >-
      {{ vcsa_iso_attach.stdout
         | regex_search('<key>mount-point</key>\s*<string>([^<]+)</string>', '\1')
         | first }}

- name: Locate the macOS vcsa-deploy in the ISO
  ansible.builtin.set_fact:
    vcsa_deploy_bin: "{{ vcsa_iso_mount }}/vcsa-cli-installer/mac/vcsa-deploy"
  when: vcsa_deploy_bin | length == 0

- name: Assert the installer binary is present
  ansible.builtin.stat:
    path: "{{ vcsa_deploy_bin }}"
  register: vcsa_deploy_stat
  failed_when: not vcsa_deploy_stat.stat.exists

- name: Read the install template's schema version
  ansible.builtin.set_fact:
    vcsa_template_version: "{{ (lookup('file', vcsa_iso_mount + '/vcsa-cli-installer/templates/install/embedded_vCSA_on_ESXi.json') | from_json)['__version'] }}"
  when: vcsa_template_version | length == 0
