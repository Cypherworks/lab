---
# Give vCenter a CA-signed machine SSL cert. We generate the key and CSR on
# the runner (CN/SAN only, since Let's Encrypt rejects a CSR carrying an email
# field, which VMCA's tls-csr always adds); lego signs it over DNS-01, then we
# PUT back the key, cert, and CA chain. Gated on the live cert's issuer and
# expiry so a converged run is a no-op and won't burn ACME rate limits.
- name: Read the live vCenter certificate
  community.crypto.get_certificate:
    host: "{{ vcsa_ip }}"
    port: 443
  register: vcsa_live_cert
  failed_when: false

- name: Decide whether the certificate needs (re)issuing
  ansible.builtin.set_fact:
    vcsa_cert_needed: >-
      {{ (vcsa_live_cert.not_after is not defined)
         or (vcsa_cert_issuer_match | length > 0
             and vcsa_cert_issuer_match not in
                 (vcsa_live_cert.issuer | default({}) | dict2items
                  | map(attribute='value') | join(' ')))
         or (((vcsa_live_cert.not_after | to_datetime('%Y%m%d%H%M%SZ'))
              - now(utc=true)).days | int < vcsa_cert_renew_before_days | int) }}

- name: Issue and install the machine SSL certificate
  when: vcsa_cert_needed | bool
  block:
    - name: Create the lego working directory
      ansible.builtin.file:
        path: "{{ vcsa_lego_workdir }}/certificates"
        state: directory
        mode: "0700"

    - name: Create a vCenter API session
      # checkov:skip=CKV_ANSIBLE_1: replacing vCenter's self-signed cert
      ansible.builtin.uri:
        url: "https://{{ vcsa_ip }}/api/session"
        method: POST
        force_basic_auth: true
        url_username: "administrator@{{ vcsa_sso_domain }}"
        url_password: "{{ vcsa_sso_password }}"
        validate_certs: false
        status_code: [200, 201]
      register: vcsa_session
      no_log: true

    - name: Generate the machine SSL private key
      community.crypto.openssl_privatekey:
        path: "{{ vcsa_lego_workdir }}/vcenter.key"
        size: "{{ vcsa_cert_key_size | int }}"
        mode: "0600"

    - name: Generate the machine SSL CSR (CN and SAN only, no email)
      community.crypto.openssl_csr:
        path: "{{ vcsa_lego_workdir }}/vcenter.csr"
        privatekey_path: "{{ vcsa_lego_workdir }}/vcenter.key"
        common_name: "{{ vcsa_cert_common_name }}"
        subject_alt_name: "{{ vcsa_cert_sans | map('regex_replace', '^', 'DNS:') | list }}"
        mode: "0600"

    - name: Sign the CSR with lego over DNS-01
      # lego v5 moved these from global to `run` command flags.
      ansible.builtin.command:
        argv: >-
          {{ [vcsa_lego_bin, 'run', '--accept-tos', '--email', vcsa_le_email,
              '--path', vcsa_lego_workdir, '--dns', vcsa_lego_dns_provider]
             + (['--server', vcsa_le_server] if vcsa_le_server | length > 0 else [])
             + ['--csr', vcsa_lego_workdir + '/vcenter.csr'] }}
      environment: "{{ vcsa_lego_env }}"
      changed_when: true

    # lego writes a fullchain .crt; vCenter wants the leaf alone in `cert`.
    - name: Extract the leaf certificate from the chain
      ansible.builtin.command:
        cmd: >-
          openssl x509
          -in {{ vcsa_lego_workdir }}/certificates/{{ vcsa_system_name }}.crt
          -out {{ vcsa_lego_workdir }}/leaf.pem
      changed_when: true

    - name: Read the leaf certificate
      ansible.builtin.slurp:
        src: "{{ vcsa_lego_workdir }}/leaf.pem"
      register: vcsa_leaf

    - name: Read the issuer (CA) chain
      ansible.builtin.slurp:
        src: "{{ vcsa_lego_workdir }}/certificates/{{ vcsa_system_name }}.issuer.crt"
      register: vcsa_chain

    # vCenter's root_cert must end in a self-signed root; lego omits it.
    - name: Read the trust anchor (self-signed root CA)
      ansible.builtin.slurp:
        src: "{{ vcsa_cert_root_ca }}"
      register: vcsa_root_ca

    - name: Read the private key
      ansible.builtin.slurp:
        src: "{{ vcsa_lego_workdir }}/vcenter.key"
      register: vcsa_key
      no_log: true

    - name: Set the vCenter machine SSL certificate
      # checkov:skip=CKV_ANSIBLE_1: replacing vCenter's self-signed cert
      ansible.builtin.uri:
        url: "https://{{ vcsa_ip }}/api/vcenter/certificate-management/vcenter/tls"
        method: PUT
        headers:
          vmware-api-session-id: "{{ vcsa_session.json }}"
        body_format: json
        body:
          cert: "{{ vcsa_leaf.content | b64decode }}"
          key: "{{ vcsa_key.content | b64decode }}"
          root_cert: "{{ (vcsa_chain.content | b64decode) + '\n' + (vcsa_root_ca.content | b64decode) }}"
        validate_certs: false
        status_code: 204
      no_log: true
