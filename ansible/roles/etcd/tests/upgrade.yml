---
# Forms a real three-member cluster on an older etcd release, on systemd in
# throwaway containers, then converges it on the role's pinned release as a
# live cluster gets it. Every member has to end up running the pinned release,
# restarted one at a time, with a writer showing quorum holds throughout.
# Needs Docker, the community.docker collection, and internet for the image,
# apt and both etcd releases. From ansible/:
#
#   ANSIBLE_ROLES_PATH=roles ansible-playbook -i localhost, \
#     roles/etcd/tests/upgrade.yml
- name: Verify a version bump upgrades a running cluster
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _old_version: "3.5.16"
    _new_version: "{{ (lookup('file', playbook_dir ~ '/../defaults/main.yml') | from_yaml).etcd_version }}"
    _net: etcd-role-test
    _members: [etcd-test-1, etcd-test-2, etcd-test-3]
    _ips: {etcd-test-1: 172.30.98.11, etcd-test-2: 172.30.98.12, etcd-test-3: 172.30.98.13}
    _endpoints: http://172.30.98.11:2379,http://172.30.98.12:2379,http://172.30.98.13:2379
    _hosts: "etcd-test-1,etcd-test-2,etcd-test-3,"
    _converge: >-
      ansible-playbook -i {{ _hosts }} -c community.docker.docker
      {{ playbook_dir }}/converge.yml
    _writer: >-
      while true; do
      ETCDCTL_API=3 etcdctl --endpoints={{ _endpoints }} --command-timeout=2s
      put counter "$(date +%s)" >/dev/null 2>&1 && date +%s >> /tmp/writes;
      sleep 0.2; done
  tasks:
    - name: Assert the role pins a newer release than the cluster starts on
      ansible.builtin.assert:
        that:
          - _new_version is version(_old_version, '>')
        fail_msg: "role pins {{ _new_version }}, test starts on {{ _old_version }}"

    - name: Clear what a failed run left behind for debugging
      ansible.builtin.shell: >-
        docker rm -f {{ _members | join(' ') }} 2>/dev/null;
        docker network rm {{ _net }} 2>/dev/null; true
      changed_when: false

    - name: Make the test network
      ansible.builtin.command: docker network create --subnet 172.30.98.0/24 {{ _net }}
      changed_when: true

    - name: Boot systemd on Debian 13, as the members run
      ansible.builtin.command: >-
        docker run -d --name {{ item }} --hostname {{ item }} --privileged --cgroupns=host
        --tmpfs /run --tmpfs /run/lock --network {{ _net }} --ip {{ _ips[item] }} debian:13 sh -c
        'apt-get update -qq && apt-get install -y -qq systemd systemd-sysv
        python3 ca-certificates && exec /lib/systemd/systemd'
      loop: "{{ _members }}"
      changed_when: true

    - name: Wait for systemd to finish booting
      ansible.builtin.command: docker exec {{ item }} systemctl is-system-running
      register: _booted
      until: _booted.stdout in ['running', 'degraded']
      retries: 60
      delay: 3
      changed_when: false
      failed_when: false
      loop: "{{ _members }}"

    - name: Form the cluster on the older release, all members together
      ansible.builtin.command: "{{ _converge }} -e etcd_version={{ _old_version }}"
      changed_when: true

    - name: Read each member's running release before the upgrade
      ansible.builtin.command: >-
        docker exec etcd-test-1 sh -c
        'ETCDCTL_API=3 etcdctl --endpoints={{ _endpoints }} endpoint status -w json'
      register: _status_before
      changed_when: false

    - name: Start the writer
      ansible.builtin.command:
        argv: [docker, exec, -d, etcd-test-3, sh, -c, "{{ _writer }}"]
      changed_when: true

    - name: Converge the running cluster on the pinned release
      ansible.builtin.command: "{{ _converge }}"
      changed_when: true

    - name: Find the writes and the longest gap between them
      ansible.builtin.shell: |
        docker exec etcd-test-3 cat /tmp/writes |
          awk 'NR>1 && $1-p>m {m=$1-p} {p=$1; n++} END {print n+0, m+0}'
      register: _writes
      changed_when: false

    - name: Read each member's running release after the upgrade
      ansible.builtin.command: >-
        docker exec etcd-test-1 sh -c
        'ETCDCTL_API=3 etcdctl --endpoints={{ _endpoints }} endpoint status -w json'
      register: _status_after
      changed_when: false

    - name: Read the installed binaries and the restart order
      ansible.builtin.shell: |
        for m in {{ _members | join(' ') }}; do
          docker exec $m sh -c 'etcd --version | head -1'
        done
        for m in {{ _members | join(' ') }}; do
          docker exec $m systemctl show -p ActiveEnterTimestampMonotonic --value etcd
        done
      register: _state
      changed_when: false

    - name: Converge again on the same release
      ansible.builtin.command: "{{ _converge }}"
      changed_when: true

    - name: Read the restart times after the second converge
      ansible.builtin.shell: |
        for m in {{ _members | join(' ') }}; do
          docker exec $m systemctl show -p ActiveEnterTimestampMonotonic --value etcd
        done
      register: _rerun
      changed_when: false

    - name: Remove the containers
      ansible.builtin.shell: >-
        docker rm -f {{ _members | join(' ') }};
        docker network rm {{ _net }}
      changed_when: true

    - name: Assert every member upgraded, in turn, with quorum held
      vars:
        _before: "{{ _status_before.stdout | from_json | map(attribute='Status.version') | list }}"
        _after: "{{ _status_after.stdout | from_json | map(attribute='Status.version') | list }}"
      ansible.builtin.assert:
        that:
          - _before == [_old_version] * 3
          - _after == [_new_version] * 3
          - "_state.stdout_lines[0:3] == ['etcd Version: ' ~ _new_version] * 3"
          - (_state.stdout_lines[3] | int) < (_state.stdout_lines[4] | int)
          - (_state.stdout_lines[4] | int) < (_state.stdout_lines[5] | int)
          - (_writes.stdout.split()[0] | int) > 20
          - (_writes.stdout.split()[1] | int) <= 6
          - _rerun.stdout_lines == _state.stdout_lines[3:6]
        fail_msg: "running {{ _before }} -> {{ _after }} / {{ _state.stdout_lines }} / rerun {{ _rerun.stdout_lines }} / writes, gap: {{ _writes.stdout }}"
