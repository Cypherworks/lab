---
# Runs the role's secret env tasks and its handlers on secret_env.yml's
# container, where systemd runs Caddy.
- name: Converge the secret env
  hosts: all
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Read the role's defaults
      ansible.builtin.include_vars:
        file: ../defaults/main.yml

    - name: Run the role's tasks
      ansible.builtin.include_tasks: ../tasks/secret_env.yml

  handlers:
    - name: Load the role's handlers
      ansible.builtin.import_tasks: ../handlers/main.yml
