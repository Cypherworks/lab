---
# Boots systemd in a privileged Debian 13 container, as the Caddy instances
# run, with stock Caddy under the unit their cloud-init writes. Converges the
# role's secret env tasks, then sends a request through the rendered
# Caddyfile to a stub upstream that echoes the Authorization header it got.
# Checks the route's {env.NAME} header reaches the upstream with the secret,
# the admin API and the Caddyfile only ever hold the placeholder, the env
# file is root-only, a second run changes nothing, an empty map removes it,
# and bad names or values fail the run. Only the DNS-01 TLS line changes, as
# the stock image has no route53 module. Needs Docker and internet for images
# and apt. From ansible/:
#
#   ansible-playbook -i localhost, roles/caddy/tests/secret_env.yml
- name: Verify the secret env
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _net: caddy-secret-env-test
    _host: caddy-secret-env-host
    _echo: caddy-secret-env-echo
    _dir: "{{ playbook_dir }}/.secret_env"
    _host_ip: 172.30.97.10
    _caddy_image: caddy:2.10.2
    _secret: c2VjcmV0LXRlc3Qtb25seQ==
    _converge: >-
      ansible-playbook -i {{ _host }}, -c community.docker.docker
      {{ playbook_dir }}/secret_env_converge.yml
    caddy_domain: caddy.test
    caddy_acme_email: test@caddy.test
    caddy_l4_proxies: []
    caddy_allowed_sources: []
    caddy_routes:
      - name: echo
        host: echo.caddy.test
        upstream: "http://echo:8080"
        header_up: {Authorization: "Basic {env.PROBE_AUTH}"}
    # The unit terraform/incus's caddy cloud-init writes.
    _unit: |
      [Unit]
      Description=Caddy
      After=network-online.target
      Wants=network-online.target
      [Service]
      EnvironmentFile=/etc/caddy/aws.env
      ExecStart=/usr/local/bin/caddy run --config /etc/caddy/Caddyfile
      ExecReload=/usr/local/bin/caddy reload --config /etc/caddy/Caddyfile
      Restart=on-failure
      User=caddy
      Group=caddy
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      [Install]
      WantedBy=multi-user.target
    _echo_server: |
      from http.server import BaseHTTPRequestHandler, HTTPServer
      class Echo(BaseHTTPRequestHandler):
          def do_GET(self):
              body = (self.headers.get("Authorization") or "none").encode()
              self.send_response(200)
              self.end_headers()
              self.wfile.write(body)
      HTTPServer(("", 8080), Echo).serve_forever()
    _ask: >-
      docker exec {{ _host }} curl -sk --resolve echo.caddy.test:443:127.0.0.1
      https://echo.caddy.test/
  tasks:
    - name: Clear what a failed run left behind for debugging
      ansible.builtin.shell: >-
        docker rm -f {{ _host }} {{ _echo }} 2>/dev/null; docker network rm {{ _net }} 2>/dev/null; true
      changed_when: false

    - name: Create the working directory
      ansible.builtin.file:
        path: "{{ _dir }}"
        state: directory
        mode: "0755"

    - name: Render the Caddyfile
      ansible.builtin.template:
        src: ../templates/Caddyfile.j2
        dest: "{{ _dir }}/Caddyfile"
        mode: "0644"

    - name: Swap DNS-01 for an internal issuer
      ansible.builtin.replace:
        path: "{{ _dir }}/Caddyfile"
        regexp: 'dns route53'
        replace: 'issuer internal'

    - name: Write the cloud-init unit
      ansible.builtin.copy:
        content: "{{ _unit }}"
        dest: "{{ _dir }}/caddy.service"
        mode: "0644"

    - name: Take Caddy's binary out of the stock image
      ansible.builtin.shell: >-
        id=$(docker create {{ _caddy_image }}) &&
        docker cp "$id":/usr/bin/caddy {{ _dir }}/caddy; rc=$?; docker rm "$id" >/dev/null; exit $rc
      changed_when: true

    - name: Make the test network
      ansible.builtin.command: docker network create --subnet 172.30.97.0/24 {{ _net }}
      changed_when: true

    - name: Start the stub upstream
      ansible.builtin.command:
        argv: [docker, run, -d, --name, "{{ _echo }}", --network, "{{ _net }}", --network-alias, echo,
               python:3.13-alpine, python3, -c, "{{ _echo_server }}"]
      changed_when: true

    - name: Boot systemd in Debian 13, as the Caddy instances run
      ansible.builtin.command: >-
        docker run -d --name {{ _host }} --privileged --cgroupns=host
        --tmpfs /run --tmpfs /run/lock --network {{ _net }} --ip {{ _host_ip }}
        --entrypoint sh debian:13 -c
        'apt-get update -qq && apt-get install -y -qq python3 sudo systemd systemd-sysv curl ca-certificates
        && exec /lib/systemd/systemd'
      changed_when: true

    - name: Wait for systemd
      ansible.builtin.command: docker exec {{ _host }} systemctl is-system-running
      register: _booted
      until: _booted.stdout in ['running', 'degraded']
      retries: 60
      delay: 3
      changed_when: false
      failed_when: false

    - name: Install Caddy as cloud-init does, and start it
      ansible.builtin.shell: >-
        docker cp {{ _dir }}/caddy {{ _host }}:/usr/local/bin/caddy &&
        docker exec {{ _host }} mkdir -p /etc/caddy &&
        docker cp {{ _dir }}/Caddyfile {{ _host }}:/etc/caddy/Caddyfile &&
        docker cp {{ _dir }}/caddy.service {{ _host }}:/etc/systemd/system/caddy.service &&
        docker exec {{ _host }} sh -c 'chmod 0755 /usr/local/bin/caddy && touch /etc/caddy/aws.env
        && groupadd --system caddy && useradd --system --gid caddy --home-dir /var/lib/caddy
        --create-home --shell /usr/sbin/nologin caddy
        && systemctl daemon-reload && systemctl enable --now caddy'
      changed_when: true

    - name: Ask through Caddy before any secret is set
      ansible.builtin.command: "{{ _ask }}"
      register: _before
      until: _before.stdout is search('^Basic')
      retries: 20
      delay: 2
      changed_when: false
      failed_when: false

    - name: Converge with the secret
      ansible.builtin.command: "{{ _converge }} -e '{{ {'caddy_secret_env': {'PROBE_AUTH': _secret}} | to_json }}'"
      register: _run_first
      changed_when: true

    - name: Converge again with nothing changed
      ansible.builtin.command: "{{ _converge }} -e '{{ {'caddy_secret_env': {'PROBE_AUTH': _secret}} | to_json }}'"
      register: _run_again
      changed_when: false

    - name: Converge with settings the role must refuse
      ansible.builtin.command: "{{ _converge }} -e '{{ {'caddy_secret_env': item.env} | to_json }}'"
      loop:
        - {env: {probe-auth: x}, says: a name the shell can't hold}
        - {env: {PROBE_AUTH: "two words"}, says: a value with a space}
        - {env: {PROBE_AUTH: 'a"b'}, says: a value with a quote}
        - {env: {PROBE_AUTH: ""}, says: an empty value}
      loop_control:
        label: "{{ item.says }}"
      register: _run_refused
      changed_when: false
      failed_when: false

    - name: Ask through Caddy with the secret set
      ansible.builtin.command: "{{ _ask }}"
      register: _after
      changed_when: false

    - name: Read the admin API's config, the Caddyfile, and how the secret is kept
      ansible.builtin.shell: >-
        docker exec {{ _host }} sh -c 'curl -s localhost:2019/config/; echo;
        cat /etc/caddy/Caddyfile; echo;
        stat -c "%n %U %a" /etc/caddy/secrets.env;
        cat /etc/systemd/system/caddy.service.d/secrets.conf'
      register: _kept
      changed_when: false

    - name: Converge with no secrets
      ansible.builtin.command: "{{ _converge }} -e '{\"caddy_secret_env\": {}}'"
      register: _run_none
      changed_when: true

    - name: Read what is left and whether Caddy still serves
      ansible.builtin.shell: >-
        docker exec {{ _host }} sh -c 'ls /etc/caddy/secrets.env /etc/systemd/system/caddy.service.d/secrets.conf 2>&1;
        systemctl is-active caddy'; {{ _ask }}
      register: _none
      changed_when: false
      failed_when: false

    - name: Remove the containers
      ansible.builtin.shell: docker rm -f {{ _host }} {{ _echo }}; docker network rm {{ _net }}
      changed_when: true

    - name: Remove the working directory
      ansible.builtin.file:
        path: "{{ _dir }}"
        state: absent

    - name: Assert the secret reaches the upstream and stays out of the config
      vars:
        _refused: "{{ _run_refused.results }}"
      ansible.builtin.assert:
        that:
          - _before.stdout == 'Basic'
          - _after.stdout == 'Basic ' ~ _secret
          - _secret not in _kept.stdout
          - _kept.stdout is search('Basic \{env\.PROBE_AUTH\}')
          - _kept.stdout is search('(?m)^/etc/caddy/secrets.env root 600$')
          - _kept.stdout is search('(?m)^EnvironmentFile=/etc/caddy/secrets.env$')
          - _run_first.stdout is search('RUNNING HANDLER \\[Restart Caddy\\]')
          - "'changed=0' in _run_again.stdout"
          - _refused | rejectattr('rc') | list | length == 0
          - _refused | rejectattr('stdout', 'search', 'caddy_secret_env') | list | length == 0
          - _none.stdout is search('secrets.env: No such file')
          - _none.stdout is search('secrets.conf: No such file')
          - _none.stdout is search('(?m)^active$')
          - _none.stdout is search('Basic$')
        fail_msg: >-
          before={{ _before.stdout }} after={{ _after.stdout }} kept={{ _kept.stdout[-800:] }}
          none={{ _none.stdout }} again={{ _run_again.stdout[-300:] }}
          {{ (_refused | map(attribute='stdout') | map('regex_search', 'msg.{0,200}') | list) }}
