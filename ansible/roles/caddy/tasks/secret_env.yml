---
# The secrets routes read as {env.NAME}: a root-only env file the Caddy service
# loads through a systemd drop-in, or neither when there are none.
- name: Require env names a shell can hold, and values systemd reads as written
  ansible.builtin.assert:
    that:
      - caddy_secret_env | dict2items | map(attribute='key') | reject('match', '^[A-Z_][A-Z0-9_]*$') | list | length == 0
      - caddy_secret_env | dict2items | map(attribute='value') | map('string') | reject('match', _value_pattern) | list | length == 0
    fail_msg: >-
      Each caddy_secret_env name must be upper case letters, digits and
      underscores, and each value non-empty with no whitespace, quotes or
      backslashes.
  vars:
    _value_pattern: '^[^\s"''\\]+$'

- name: Write the secrets Caddy's routes read
  become: true
  ansible.builtin.copy:
    content: "{% for name, value in caddy_secret_env | dictsort %}{{ name }}={{ value }}\n{% endfor %}"
    dest: "{{ caddy_config_path | dirname }}/secrets.env"
    owner: root
    group: root
    mode: "0600"
  when: caddy_secret_env | length > 0
  no_log: true
  notify: Restart Caddy

- name: Make the Caddy service's drop-in directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: caddy_secret_env | length > 0

- name: Load them into the Caddy service
  become: true
  ansible.builtin.copy:
    content: |
      [Service]
      EnvironmentFile={{ caddy_config_path | dirname }}/secrets.env
    dest: /etc/systemd/system/caddy.service.d/secrets.conf
    owner: root
    group: root
    mode: "0644"
  when: caddy_secret_env | length > 0
  notify: Restart Caddy

- name: Remove the secrets and the drop-in when there are none
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ caddy_config_path | dirname }}/secrets.env"
    - /etc/systemd/system/caddy.service.d/secrets.conf
  when: caddy_secret_env | length == 0
  notify: Restart Caddy
