---
# Refresh the system trust store after installing a CA. Defined before Reload Caddy
# so, when both fire, the store is updated before Caddy re-reads its trust pool.
- name: Update CA trust
  become: true
  ansible.builtin.command: update-ca-certificates
  changed_when: true

# Graceful, sub-second config swap — no dropped connections, no restart.
- name: Reload Caddy
  become: true
  ansible.builtin.command: "{{ caddy_binary }} reload --adapter caddyfile --config {{ caddy_config_path }}"
  changed_when: true

# Restarts 3s after returning, as Ansible's connection may run through Caddy.
- name: Schedule a Caddy restart
  become: true
  ansible.builtin.command: >-
    systemd-run --on-active=3 /bin/sh -c 'systemctl daemon-reload && systemctl restart caddy'
  changed_when: true
  listen: Restart Caddy

- name: Wait for the host after Caddy's restart
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 120
  listen: Restart Caddy

- name: Check Caddy came back
  become: true
  ansible.builtin.service_facts:
  register: _caddy_services
  until: _caddy_services.ansible_facts.services['caddy.service'].state | default('') == 'running'
  retries: 10
  delay: 3
  listen: Restart Caddy
