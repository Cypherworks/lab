---
# firewall: a host firewall (ufw) that denies inbound by default and keeps SSH
# open, so Ansible never loses its way in. Generic mechanism; the deployment
# lists what else each host serves.

# false writes the rules without turning ufw on.
firewall_enabled: true

firewall_default_incoming: deny
firewall_default_outgoing: allow
firewall_allow_loopback: true

# Apart from firewall_rules, so setting those can't drop SSH. Empty: anywhere.
firewall_ssh_port: 22
firewall_ssh_sources: []

# Each rule: port, proto, from (default anywhere), rule, comment.
firewall_rules: []
